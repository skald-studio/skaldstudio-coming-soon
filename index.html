
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description" content="SKALD STUDIO is an independent design practice specializing in brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#88797a">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: #88797a;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #88797a;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture {
      display: block;
      width: 100%;
    }

    picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* DESKTOP CONTACT AREA */

    .contact {
      position: absolute;
      left: 73%;
      top: 63%;
      width: 24%;
      height: 9%;
      z-index: 10;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-normal.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>
</body>
</html>
