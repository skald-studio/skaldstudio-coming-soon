
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
        content="SKALD STUDIO is an independent design practice specializing in brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#88797a">

  <style>
    :root {
      --site-bg: #88797a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background-color: var(--site-bg);
      transition: background-color 650ms ease-in-out;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--site-bg);
      transition: background-color 650ms ease-in-out;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture {
      display: block;
      width: 100%;
    }

    picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* DUAL ANIMATION LAYERS */

    .glitch-frame {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* DESKTOP CONTACT */

    .contact {
      position: absolute;
      left: 73%;
      top: 63%;
      width: 24%;
      height: 9%;
      z-index: 10;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }

      .glitch-frame {
        display: block;
      }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      html, body {
        transition: none !important;
      }

      .glitch-frame {
        display: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- RESPONSIVE BASE -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-normal.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- ANIMATION LAYERS -->

    <img
      id="glitch-a"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <img
      id="glitch-b"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- CONTACT LINK -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO
      MOBILE ANIMATION V5

      00–10s  NORMAL
      10–13s  NORMAL TO LIGHT

      13–23s  LIGHT
      23–26s  LIGHT TO DARK

      26–36s  DARK
      36–39s  DARK TO NORMAL

      REPEAT / ENDLESS LOOP
    */

    /* DISPLAY CONDITIONS */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const layers = [
      document.getElementById("glitch-a"),
      document.getElementById("glitch-b")
    ];

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    /* MASTER SETTINGS */

    const STATIC_DURATION = 10000;
    const TRANSITION_DURATION = 3000;
    const CROSSFADE_DURATION = 70;
    const BACKGROUND_DURATION = 650;

    const IMAGE_VERSION = "v5";

    /*
      THREE STATES

      NORMAL / BRAND IDENTITY
      LIGHT  / APPAREL & PRODUCT DESIGN
      DARK   / DEVELOPMENT & PRODUCTION
    */

    const states = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-",
        background: "#88797a"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-",
        background: "#c7c8c5"
      },

      dark: {
        master: "skaldstudio-mobile-dark.webp",
        prefix: "skaldstudio-mobile-dark-character-",
        background: "#292b2b"
      }
    };

    const stateOrder = [
      "normal",
      "light",
      "dark"
    ];

    /* FILE PATHS */

    function framePath(state, number) {
      const index = String(number).padStart(2, "0");

      return (
        states[state].prefix +
        index +
        ".webp?" +
        IMAGE_VERSION
      );
    }

    function masterPath(state) {
      return (
        states[state].master +
        "?" +
        IMAGE_VERSION
      );
    }

    /*
      TRANSITION SEQUENCE

      FORWARD:
      01 TO 09 / CURRENT STATE

      RETURN:
      08 CURRENT
      07 CURRENT
      06 NEXT
      05 CURRENT
      04 NEXT
      03 NEXT
      02 NEXT
      01 NEXT

      FINISH:
      NEXT MASTER
    */

    function buildSequence(from, to) {
      const sequence = [];

      for (let n = 1; n <= 9; n++) {
        sequence.push({
          state: from,
          number: n,
          src: framePath(from, n)
        });
      }

      const returnFrames = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of returnFrames) {
        sequence.push({
          state,
          number,
          src: framePath(state, number)
        });
      }

      sequence.push({
        state: to,
        number: 0,
        src: masterPath(to)
      });

      return sequence;
    }

    /* BACKGROUND COLOR CONTROL */

    function setBackground(state, instant = false) {
      const color = states[state].background;

      const root = document.documentElement;

      if (instant) {
        root.style.transition = "none";
        document.body.style.transition = "none";
      }

      root.style.setProperty("--site-bg", color);

      if (themeColor) {
        themeColor.setAttribute("content", color);
      }

      if (instant) {
        void document.body.offsetWidth;
        root.style.transition = "";
        document.body.style.transition = "";
      }
    }

    /* PRELOAD ALL THREE STATES */

    const imageCache = new Map();
    let preloadPromise = null;

    function preloadImages() {
      if (preloadPromise) return preloadPromise;

      const paths = [];

      for (const state of stateOrder) {
        paths.push(masterPath(state));

        for (let n = 1; n <= 9; n++) {
          paths.push(framePath(state, n));
        }
      }

      preloadPromise = Promise.all(
        paths.map(src => new Promise(resolve => {
          const image = new Image();

          imageCache.set(src, image);

          image.onload = () => resolve(true);

          image.onerror = () => {
            console.error("Image loading failed:", src);
            resolve(false);
          };

          image.src = src;
        }))
      ).then(results => results.every(Boolean));

      return preloadPromise;
    }

    /* TIMING HELPERS */

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    let runId = 0;
    let activeLayer = null;

    function isActive(id) {
      return (
        id === runId &&
        portrait.matches &&
        !reducedMotion.matches &&
        !document.hidden
      );
    }

    /* RESET LAYERS */

    function resetLayers() {
      layers.forEach(layer => {
        layer.style.transition = "none";
        layer.style.opacity = "0";
        layer.style.filter = "none";
        layer.style.zIndex = "1";
      });

      activeLayer = null;
    }

    /*
      INDIVIDUAL STATE EFFECTS

      NORMAL TO LIGHT:
      EXPOSURE BLEED

      LIGHT TO DARK:
      SOFT CONTRAST COLLAPSE

      DARK TO NORMAL:
      SUBTLE EXPOSURE RECOVERY

      MOTION SMEAR:
      RETAINED FROM PHOTOSHOP FRAMES
    */

    function getEffect(step, from, to) {
      const enteringNext =
        step.state === to &&
        (step.number === 6 || step.number === 4);

      if (!enteringNext) return null;

      if (from === "normal" && to === "light") {
        return {
          filter: "brightness(1.08) blur(0.8px)",
          duration: 160
        };
      }

      if (from === "light" && to === "dark") {
        return {
          filter: "brightness(0.88) contrast(1.10) blur(0.5px)",
          duration: 150
        };
      }

      if (from === "dark" && to === "normal") {
        return {
          filter: "brightness(0.96) blur(0.4px)",
          duration: 140
        };
      }

      return null;
    }

    /* DUAL LAYER CROSSFADE */

    async function crossfadeTo(step, from, to, id) {
      if (!isActive(id)) return false;

      const previous = activeLayer;

      const incoming =
        previous === layers[0]
          ? layers[1]
          : layers[0];

      const effect = getEffect(step, from, to);

      incoming.style.transition = "none";
      incoming.style.opacity = "0";
      incoming.style.zIndex = "3";

      incoming.style.filter = effect
        ? effect.filter
        : "none";

      incoming.src = step.src;

      if (previous) {
        previous.style.zIndex = "2";
      }

      /* Apply initial styles before animation */

      void incoming.offsetWidth;

      const filterDuration = effect
        ? effect.duration
        : CROSSFADE_DURATION;

      incoming.style.transition =
        `opacity ${CROSSFADE_DURATION}ms linear,
         filter ${filterDuration}ms ease-out`;

      incoming.style.opacity = "1";
      incoming.style.filter = "none";

      await wait(
        Math.max(
          CROSSFADE_DURATION,
          filterDuration
        )
      );

      if (!isActive(id)) return false;

      if (previous) {
        previous.style.transition = "none";
        previous.style.opacity = "0";
        previous.style.zIndex = "1";
      }

      activeLayer = incoming;

      return true;
    }

    /* RUN THREE SECOND TRANSITION */

    async function runTransition(from, to, id) {
      const sequence = buildSequence(from, to);

      const stepDuration =
        TRANSITION_DURATION / sequence.length;

      const started = performance.now();

      let backgroundChanged = false;

      for (let i = 0; i < sequence.length; i++) {
        if (!isActive(id)) return false;

        const step = sequence[i];

        /*
          Background begins changing when
          the next state first appears.
        */

        if (
          !backgroundChanged &&
          step.state === to
        ) {
          setBackground(to);
          backgroundChanged = true;
        }

        const success = await crossfadeTo(
          step,
          from,
          to,
          id
        );

        if (!success) return false;

        /* Maintain approximately 3 seconds */

        const nextTime =
          started + (i + 1) * stepDuration;

        const remaining =
          nextTime - performance.now();

        if (remaining > 0) {
          await wait(remaining);
        }
      }

      return isActive(id);
    }

    /*
      MAIN ANIMATION LOOP

      NORMAL 10s
      NORMAL TO LIGHT 3s

      LIGHT 10s
      LIGHT TO DARK 3s

      DARK 10s
      DARK TO NORMAL 3s

      REPEAT
    */

    async function playAnimation(id) {
      if (!isActive(id)) return;

      const startup = await Promise.all([
        wait(STATIC_DURATION),
        preloadImages()
      ]);

      if (!isActive(id) || !startup[1]) {
        return;
      }

      let currentIndex = 0;

      while (isActive(id)) {
        const nextIndex =
          (currentIndex + 1) % stateOrder.length;

        const from = stateOrder[currentIndex];
        const to = stateOrder[nextIndex];

        const completed = await runTransition(
          from,
          to,
          id
        );

        if (!completed || !isActive(id)) break;

        currentIndex = nextIndex;

        /* Hold each state for 10 seconds */

        await wait(STATIC_DURATION);
      }
    }

    /* ORIENTATION AND MOTION CONTROL */

    function restartAnimation() {
      runId++;

      resetLayers();
      setBackground("normal", true);

      if (
        portrait.matches &&
        !reducedMotion.matches &&
        !document.hidden
      ) {
        playAnimation(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    /* START */

    restartAnimation();
  </script>

</body>
</html>
