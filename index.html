
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
    content="SKALD STUDIO. Independent design practice. Brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#c7c8c5">

  <style>
    :root {
      --site-bg: #c7c8c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--site-bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* PERMANENT BASE IMAGES */

    .base-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .base-mobile {
      display: none;
    }

    /* TEMPORARY TRANSITION LAYER */

    .transition-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* DESKTOP CONTACT HOTSPOT */

    .contact {
      position: absolute;
      display: block;
      left: 81.4%;
      top: 70.6%;
      width: 12.8%;
      height: 3%;
      z-index: 20;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .contact:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /*
      MOBILE PORTRAIT

      New V10 layout.
      Email hotspot positioned over
      CONTACT@SKALDSTUDIO.COM.
    */

    @media (max-width: 700px) and (orientation: portrait) {
      .base-desktop {
        display: none;
      }

      .base-mobile {
        display: block;
      }

      .contact {
        left: 10.9%;
        top: 91.1%;
        width: 35%;
        height: 2.5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .transition-image {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- DESKTOP V10 -->

    <img
      id="desktop-base"
      class="base-image base-desktop"
      src="skaldstudio-desktop-light-bg.webp"
      alt=""
      fetchpriority="high"
    >

    <!-- MOBILE V10 -->

    <img
      id="mobile-base"
      class="base-image base-mobile"
      src="skaldstudio-mobile-light-bg.webp"
      alt=""
    >

    <!-- SHARED TRANSITION LAYER -->

    <img
      id="transition-image"
      class="transition-image"
      alt=""
      aria-hidden="true"
    >

    <!-- CONTACT LINK -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
      title="contact@skaldstudio.com"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO

      DESKTOP V10 + MOBILE V10

      IDENTICAL STORYBOARD
      IDENTICAL TIMING
      IDENTICAL TRANSITIONS

      00:00 - 00:10 LIGHT
      00:10 - 00:14 LIGHT HOLD
      00:14 - 00:20 LIGHT TO DARK
      00:20 - 00:24 DARK HOLD
      00:24 - 00:28 BACK TO LIGHT

      TOTAL: 28 SECONDS

      MOBILE V5 REMOVED
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const desktopBase =
      document.getElementById("desktop-base");

    const mobileBase =
      document.getElementById("mobile-base");

    const overlay =
      document.getElementById("transition-image");

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    const COLORS = {
      light: "#c7c8c5",
      dark: "#292b2b"
    };

    const LOOP_DURATION = 28000;

    let runId = 0;
    let currentAnimation = null;
    let currentTone = "light";

    const imageCache = new Map();

    const wait = ms =>
      new Promise(resolve =>
        setTimeout(resolve, Math.max(0, ms))
      );

    /* RESPONSIVE MODE */

    function currentMode() {
      return portrait.matches
        ? "mobile"
        : "desktop";
    }

    function isActive(id, mode) {
      return (
        id === runId &&
        currentMode() === mode &&
        !document.hidden &&
        !reducedMotion.matches
      );
    }

    function getBase(mode) {
      return mode === "mobile"
        ? mobileBase
        : desktopBase;
    }

    function setBackground(state) {
      const color = COLORS[state];

      document.documentElement.style.setProperty(
        "--site-bg",
        color
      );

      if (themeColor) {
        themeColor.setAttribute("content", color);
      }
    }

    /* IMAGE FILENAMES */

    function imagePath(mode, state, product, number) {
      if (product === "bg") {
        return (
          "skaldstudio-" +
          mode + "-" +
          state +
          "-bg.webp"
        );
      }

      return (
        "skaldstudio-" +
        mode + "-" +
        state + "-" +
        product + "-" +
        String(number).padStart(2, "0") +
        ".webp"
      );
    }

    /*
      IMAGE LOADING

      Retain each loaded image in memory
      so it remains ready during playback.
    */

    function ensureImage(src) {
      if (imageCache.has(src)) {
        return imageCache.get(src).ready;
      }

      const image = new Image();

      const ready = new Promise(resolve => {
        image.onload = async () => {
          if (typeof image.decode === "function") {
            try {
              await image.decode();
            } catch (error) {
              // Image is still available.
            }
          }

          resolve(true);
        };

        image.onerror = () => {
          console.error("Missing image:", src);
          resolve(false);
        };

        image.src = src;
      });

      imageCache.set(src, { image, ready });

      return ready;
    }

    async function preloadImages(steps) {
      const paths = [
        ...new Set(steps.map(step => step.src))
      ];

      const results = await Promise.all(
        paths.map(ensureImage)
      );

      return results.every(Boolean);
    }

    /* CLEAR TEMPORARY TRANSITION */

    function clearOverlay() {
      if (currentAnimation) {
        currentAnimation.cancel();
        currentAnimation = null;
      }

      overlay.getAnimations().forEach(
        animation => animation.cancel()
      );

      overlay.style.opacity = "0";
      overlay.removeAttribute("src");
    }

    /*
      FRAME ENGINE

      CUT:
      Immediate image replacement.

      GHOST:
      Progressive temporary overlap.

      FADE:
      Short opacity transition.

      HOLD:
      Full opacity, static image.

      The base image is always opaque.
      Only one temporary layer is used.
    */

    async function displayFrame(step, id, mode) {
      if (!isActive(id, mode)) {
        return false;
      }

      const loaded = await ensureImage(step.src);

      if (!loaded || !isActive(id, mode)) {
        return false;
      }

      const base = getBase(mode);

      let effect = step.effect || "cut";

      /*
        A change between LIGHT and DARK
        always uses a clean cut.

        Same behavior on desktop and mobile.
      */

      if (
        step.state &&
        step.state !== currentTone
      ) {
        effect = "cut";
      }

      /* CUT / HOLD */

      if (effect === "cut" || effect === "hold") {
        clearOverlay();

        base.src = step.src;

        if (step.state) {
          setBackground(step.state);
          currentTone = step.state;
        }

        return true;
      }

      /* GHOST / FADE */

      clearOverlay();

      overlay.src = step.src;
      overlay.style.opacity = "0";

      const fade = Math.min(
        step.fade || 100,
        step.ms
      );

      let keyframes;

      if (effect === "ghost") {
        keyframes = [
          { opacity: 0, offset: 0 },
          { opacity: 0.22, offset: 0.36 },
          { opacity: 0.62, offset: 0.72 },
          { opacity: 1, offset: 1 }
        ];
      } else {
        keyframes = [
          { opacity: 0 },
          { opacity: 1 }
        ];
      }

      const animation = overlay.animate(
        keyframes,
        {
          duration: fade,
          easing:
            effect === "ghost"
              ? "ease-in-out"
              : "linear",
          fill: "forwards"
        }
      );

      currentAnimation = animation;

      try {
        await animation.finished;
      } catch (error) {
        return false;
      }

      if (!isActive(id, mode)) {
        return false;
      }

      /*
        Replace the permanent base before
        removing the transition overlay.
      */

      base.src = step.src;

      await new Promise(resolve =>
        requestAnimationFrame(resolve)
      );

      if (!isActive(id, mode)) {
        return false;
      }

      clearOverlay();

      if (step.state) {
        setBackground(step.state);
        currentTone = step.state;
      }

      return true;
    }

    /*
      ACCURATE 28 SECOND TIMELINE

      Uses absolute deadlines to prevent
      small delays from accumulating.
    */

    async function playTimeline(steps, id, mode) {
      while (isActive(id, mode)) {
        const startTime = performance.now();
        let elapsed = 0;

        for (const step of steps) {
          if (!isActive(id, mode)) {
            return;
          }

          const completed = await displayFrame(
            step,
            id,
            mode
          );

          if (!completed) {
            return;
          }

          elapsed += step.ms;

          await wait(
            startTime + elapsed - performance.now()
          );
        }

        await wait(
          startTime + LOOP_DURATION - performance.now()
        );
      }
    }

    /* ====================================
       SHARED V10 STORYBOARD

       This is the approved Desktop V10
       image order and timing.

       Both formats use this one timeline.
       ==================================== */

    const storyboard = [];

    function frame(
      state,
      product,
      number,
      ms,
      effect = "cut",
      fade = 100
    ) {
      storyboard.push({
        state,
        product,
        number,
        ms,
        effect,
        fade
      });
    }

    /*
      01 / LIGHT
      00:00 - 00:04
    */

    frame("light", "bg", 0, 4000, "hold");

    /*
      00:04 - 00:06
      DJUP LIGHT
    */

    for (const n of [1, 2, 4, 5, 6]) {
      frame(
        "light", "djup", n,
        400, "ghost", 240
      );
    }

    /*
      00:06 - 00:07.50
      STRAUM INTERRUPTIONS
    */

    [
      ["straum", 6, 170],
      ["straum", 2, 180],
      ["djup",   2, 240],
      ["straum", 1, 160],
      ["straum", 4, 190],
      ["straum", 5, 240],
      ["djup",   4, 320]
    ].forEach(([product, n, ms]) => {
      frame("light", product, n, ms, "cut");
    });

    /*
      00:07.50 - 00:10
      MIXED FADE / CUT
    */

    [
      ["djup",    7, 360, "fade", 120],
      ["straum",  7, 280, "cut",    0],
      ["straum",  8, 250, "cut",    0],
      ["djup",    8, 420, "fade", 140],
      ["straum",  8, 250, "cut",    0],
      ["straum", 10, 450, "fade", 100],
      ["djup",    9, 490, "fade", 160]
    ].forEach(([product, n, ms, effect, fade]) => {
      frame(
        "light", product, n,
        ms, effect, fade
      );
    });

    /*
      02 / LIGHT HOLD
      00:10 - 00:14
    */

    frame(
      "light", "djup", 10,
      4000, "hold"
    );

    /*
      03 / LIGHT TO DARK
      00:14 - 00:16
    */

    [
      ["light", "djup",    8, 250, "ghost", 140],
      ["light", "djup",    7, 230, "ghost", 130],
      ["dark",  "djup",    1, 250, "cut",     0],
      ["dark",  "djup",    3, 270, "ghost", 140],
      ["dark",  "straum",  3, 250, "fade",  100],
      ["light", "djup",    6, 400, "cut",     0],
      ["dark",  "djup",    5, 350, "cut",     0]
    ].forEach(([state, product, n, ms, effect, fade]) => {
      frame(
        state, product, n,
        ms, effect, fade
      );
    });

    /*
      00:16 - 00:17.50
    */

    [
      ["dark",  "djup",   6, 230],
      ["dark",  "djup",   4, 190],
      ["dark",  "straum", 5, 210],
      ["dark",  "straum", 4, 180],
      ["light", "straum", 4, 220],
      ["dark",  "djup",   7, 240],
      ["dark",  "djup",   8, 230]
    ].forEach(([state, product, n, ms]) => {
      frame(state, product, n, ms, "cut");
    });

    /*
      00:17.50 - 00:20
    */

    [
      ["dark",  "straum",  7, 280],
      ["dark",  "straum",  6, 260],
      ["dark",  "djup",    8, 370],
      ["light", "djup",    8, 400],
      ["dark",  "straum",  9, 290],
      ["dark",  "straum", 10, 450],
      ["dark",  "djup",    9, 450]
    ].forEach(([state, product, n, ms]) => {
      frame(state, product, n, ms, "cut");
    });

    /*
      04 / DARK HOLD
      00:20 - 00:24
    */

    frame(
      "dark", "djup", 10,
      4000, "hold"
    );

    /*
      05 / BACK TO LIGHT
      00:24 - 00:26
    */

    [
      ["dark",  "djup",    9, 260],
      ["dark",  "djup",    7, 270],
      ["dark",  "djup",    6, 300],
      ["dark",  "straum",  5, 270],
      ["light", "straum", 10, 310],
      ["light", "djup",    8, 300],
      ["dark",  "djup",    5, 290]
    ].forEach(([state, product, n, ms]) => {
      frame(state, product, n, ms, "cut");
    });

    /*
      00:26 - 00:28
      RETURN TO LIGHT BG
    */

    [
      ["light", "djup",    6, 220, "cut",     0],
      ["dark",  "djup",    3, 230, "cut",     0],
      ["light", "djup",    4, 270, "cut",     0],
      ["light", "straum",  6, 200, "cut",     0],
      ["light", "djup",    2, 320, "ghost", 170],
      ["light", "djup",    1, 280, "ghost", 180],
      ["light", "bg",      0, 480, "ghost", 320]
    ].forEach(([state, product, n, ms, effect, fade]) => {
      frame(
        state, product, n,
        ms, effect, fade
      );
    });

    /* ====================================
       GENERATE BOTH FORMATS

       SAME STORYBOARD.
       DIFFERENT IMAGE PREFIX.
       ==================================== */

    function buildSteps(mode) {
      return storyboard.map(step => ({
        ...step,
        src: imagePath(
          mode,
          step.state,
          step.product,
          step.number
        )
      }));
    }

    const desktopSteps = buildSteps("desktop");
    const mobileSteps = buildSteps("mobile");

    /* TIMING VERIFICATION */

    function totalDuration(steps) {
      return Math.round(
        steps.reduce(
          (total, step) => total + step.ms,
          0
        )
      );
    }

    console.assert(
      totalDuration(desktopSteps) === LOOP_DURATION,
      "Desktop must equal 28000 ms"
    );

    console.assert(
      totalDuration(mobileSteps) === LOOP_DURATION,
      "Mobile must equal 28000 ms"
    );

    /* ====================================
       PLAYBACK
       ==================================== */

    async function startPlayback(id, mode) {
      const steps =
        mode === "mobile"
          ? mobileSteps
          : desktopSteps;

      const ready = await preloadImages(steps);

      if (!isActive(id, mode) || !ready) {
        return;
      }

      playTimeline(steps, id, mode);
    }

    /* ====================================
       RESPONSIVE CONTROL
       ==================================== */

    function restartAnimation() {
      runId++;

      clearOverlay();

      const mode = currentMode();

      currentTone = "light";
      setBackground("light");

      desktopBase.src =
        "skaldstudio-desktop-light-bg.webp";

      mobileBase.src =
        "skaldstudio-mobile-light-bg.webp";

      if (
        document.hidden ||
        reducedMotion.matches
      ) {
        if (reducedMotion.matches) {
          getBase(mode).src = imagePath(
            mode, "light", "djup", 10
          );
        }

        return;
      }

      startPlayback(runId, mode);
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    /* START */

    restartAnimation();

  </script>
</body>
</html>
