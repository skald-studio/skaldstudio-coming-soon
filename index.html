
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
    content="SKALD STUDIO. Independent design practice. Brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#c7c8c5">

  <style>
    :root {
      --site-bg: #c7c8c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: var(--site-bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .base-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .base-mobile {
      display: none;
    }

    /*
      TEMPORARY TRANSITION LAYER

      Only used while changing images.
      The permanent base image is updated
      before this layer is removed.
    */

    .transition-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0;
      z-index: 2;
      pointer-events: none;
    }

    /*
      CONTACT LINK
      ALWAYS ABOVE THE ANIMATION
    */

    .contact {
      position: absolute;
      display: block;
      left: 70%;
      top: 57%;
      width: 28%;
      height: 25%;
      z-index: 20;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .contact:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /*
      MOBILE PORTRAIT
      EXISTING V5 LAYOUT
    */

    @media (max-width: 700px) and (orientation: portrait) {
      :root {
        --site-bg: #88797a;
      }

      .base-desktop {
        display: none;
      }

      .base-mobile {
        display: block;
      }

      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .transition-image {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- DESKTOP STARTS ON LIGHT BG -->

    <img
      id="desktop-base"
      class="base-image base-desktop"
      src="skaldstudio-desktop-light-bg.webp"
      alt=""
      fetchpriority="high"
    >

    <!-- MOBILE RETAINS ORIGINAL START -->

    <img
      id="mobile-base"
      class="base-image base-mobile"
      src="skaldstudio-mobile-normal.webp"
      alt=""
    >

    <!-- ONLY ONE TEMPORARY IMAGE LAYER -->

    <img
      id="transition-image"
      class="transition-image"
      alt=""
      aria-hidden="true"
    >

    <!-- PERMANENT CONTACT LINK -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
      title="contact@skaldstudio.com"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO
      DESKTOP ANIMATION V10

      USER APPROVED STORYBOARD

      00:00 - 00:10  LIGHT SEQUENCE
      00:10 - 00:14  LIGHT HOLD
      00:14 - 00:20  LIGHT / DARK
      00:20 - 00:24  DARK HOLD
      00:24 - 00:28  BACK TO LIGHT

      TOTAL: 28 SECONDS

      NO GLITCH FILTERS
      NO BLEND MODES
      NO DOUBLE IMAGE RESIDUE
      NO SEPARATE DARK BG FRAME

      MOBILE PORTRAIT:
      V5 THREE STATE LOOP, 39 SECONDS
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const desktopBase =
      document.getElementById("desktop-base");

    const mobileBase =
      document.getElementById("mobile-base");

    const overlay =
      document.getElementById("transition-image");

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    const COLORS = {
      normal: "#88797a",
      light: "#c7c8c5",
      dark: "#292b2b"
    };

    const DESKTOP_DURATION = 28000;
    const MOBILE_DURATION = 39000;

    let runId = 0;
    let currentAnimation = null;
    let desktopTone = "light";

    const imageCache = new Map();

    const wait = ms =>
      new Promise(resolve =>
        setTimeout(resolve, Math.max(0, ms))
      );

    function currentMode() {
      return portrait.matches
        ? "mobile"
        : "desktop";
    }

    function isActive(id, mode) {
      return (
        id === runId &&
        currentMode() === mode &&
        !document.hidden &&
        !reducedMotion.matches
      );
    }

    function getBase(mode) {
      return mode === "mobile"
        ? mobileBase
        : desktopBase;
    }

    function setBackground(state) {
      const color = COLORS[state];

      document.documentElement.style.setProperty(
        "--site-bg",
        color
      );

      if (themeColor) {
        themeColor.setAttribute(
          "content",
          color
        );
      }
    }

    /*
      IMAGE PRELOADING

      Each required image is loaded once.
      Frames are decoded before playback.
    */

    function ensureImage(src) {
      if (imageCache.has(src)) {
        return imageCache.get(src);
      }

      const image = new Image();

      const promise = new Promise(resolve => {
        image.onload = async () => {
          if (typeof image.decode === "function") {
            try {
              await image.decode();
            } catch (error) {
              // The loaded image remains usable.
            }
          }

          resolve(true);
        };

        image.onerror = () => {
          console.error("Missing image:", src);
          resolve(false);
        };

        image.src = src;
      });

      imageCache.set(src, promise);

      return promise;
    }

    async function preloadImages(steps) {
      const paths = [
        ...new Set(steps.map(step => step.src))
      ];

      const results = await Promise.all(
        paths.map(ensureImage)
      );

      return results.every(Boolean);
    }

    /*
      CLEAR TRANSITION

      Removes the temporary image.
      Does not alter the permanent base.
    */

    function clearOverlay() {
      if (currentAnimation) {
        currentAnimation.cancel();
        currentAnimation = null;
      }

      overlay.getAnimations().forEach(
        animation => animation.cancel()
      );

      overlay.style.opacity = "0";
      overlay.removeAttribute("src");
    }

    /*
      FRAME ENGINE

      CUT:
        Immediate image replacement.

      GHOST:
        Controlled temporary overlap.
        Best for gradual DJUP changes.

      FADE:
        Short, simple transition.
        Best for selected STRAUM images.

      HOLD:
        Full opacity, absolutely static.

      Every finished frame replaces the
      base image at 100% opacity.
    */

    async function displayFrame(step, id, mode) {
      if (!isActive(id, mode)) {
        return false;
      }

      const loaded = await ensureImage(step.src);

      if (!loaded || !isActive(id, mode)) {
        return false;
      }

      const base = getBase(mode);

      let effect = step.effect || "cut";

      /*
        Desktop never crossfades complete
        LIGHT and DARK backgrounds.
      */

      if (
        mode === "desktop" &&
        step.state &&
        step.state !== desktopTone
      ) {
        effect = "cut";
      }

      if (effect === "cut" || effect === "hold") {
        clearOverlay();

        base.src = step.src;

        if (step.state) {
          setBackground(step.state);
        }

        if (mode === "desktop" && step.state) {
          desktopTone = step.state;
        }

        if (step.background) {
          setBackground(step.background);
        }

        return true;
      }

      /*
        GHOST / FADE

        The incoming image appears above
        the existing opaque base image.
      */

      clearOverlay();

      overlay.src = step.src;
      overlay.style.opacity = "0";

      const fade = Math.min(
        step.fade || 100,
        step.ms
      );

      let keyframes;

      if (effect === "ghost") {
        keyframes = [
          { opacity: 0, offset: 0 },
          { opacity: 0.22, offset: 0.36 },
          { opacity: 0.62, offset: 0.72 },
          { opacity: 1, offset: 1 }
        ];
      } else {
        keyframes = [
          { opacity: 0 },
          { opacity: 1 }
        ];
      }

      const filterStart =
        step.filterStart || "none";

      keyframes[0].filter = filterStart;
      keyframes[keyframes.length - 1].filter = "none";

      const animation = overlay.animate(
        keyframes,
        {
          duration: fade,
          easing:
            effect === "ghost"
              ? "ease-in-out"
              : "linear",
          fill: "forwards"
        }
      );

      currentAnimation = animation;

      try {
        await animation.finished;
      } catch (error) {
        return false;
      }

      if (!isActive(id, mode)) {
        return false;
      }

      /*
        Commit the new image to the base.
        Keep overlay visible through
        the next browser paint.
      */

      base.src = step.src;

      await new Promise(resolve =>
        requestAnimationFrame(resolve)
      );

      if (!isActive(id, mode)) {
        return false;
      }

      clearOverlay();

      if (step.background) {
        setBackground(step.background);
      }

      if (mode === "desktop" && step.state) {
        desktopTone = step.state;
      }

      return true;
    }

    /*
      ACCURATE TIMELINE

      All durations use absolute deadlines.
      Small rendering delays do not accumulate
      across the 28 second sequence.
    */

    async function playTimeline(
      steps,
      duration,
      id,
      mode
    ) {
      while (isActive(id, mode)) {
        const startTime = performance.now();
        let elapsed = 0;

        for (const step of steps) {
          if (!isActive(id, mode)) {
            return;
          }

          const completed = await displayFrame(
            step,
            id,
            mode
          );

          if (!completed) {
            return;
          }

          elapsed += step.ms;

          const deadline =
            startTime + elapsed;

          await wait(
            deadline - performance.now()
          );
        }

        const cycleEnd =
          startTime + duration;

        if (performance.now() < cycleEnd) {
          await wait(
            cycleEnd - performance.now()
          );
        }
      }
    }

    /* ==========================================
       DESKTOP FRAME NAMING
       ========================================== */

    function desktopFrame(state, product, number) {
      if (product === "bg") {
        return (
          "skaldstudio-desktop-" +
          state +
          "-bg.webp"
        );
      }

      return (
        "skaldstudio-desktop-" +
        state + "-" +
        product + "-" +
        String(number).padStart(2, "0") +
        ".webp"
      );
    }

    const desktopSteps = [];

    function frame(
      state,
      product,
      number,
      ms,
      effect = "cut",
      fade = 100
    ) {
      desktopSteps.push({
        src: desktopFrame(
          state,
          product,
          number
        ),
        state,
        ms,
        effect,
        fade
      });
    }

    /*
      ==========================================
      01 / LIGHT

      00:00 - 00:04
      STATIC LIGHT BACKGROUND
      ==========================================
    */

    frame(
      "light", "bg", 0,
      4000, "hold"
    );

    /*
      00:04 - 00:06

      FIVE FRAMES
      400 MS EACH
      MIX GHOST
    */

    for (const n of [1, 2, 4, 5, 6]) {
      frame(
        "light", "djup", n,
        400, "ghost", 240
      );
    }

    /*
      00:06 - 00:07.50

      FAST CUTS
      VARIABLE 150 - 320 MS
    */

    [
      ["straum", 6, 170],
      ["straum", 2, 180],
      ["djup",   2, 240],
      ["straum", 1, 160],
      ["straum", 4, 190],
      ["straum", 5, 240],
      ["djup",   4, 320]
    ].forEach(([product, n, ms]) => {
      frame(
        "light", product, n,
        ms, "cut"
      );
    });

    /*
      00:07.50 - 00:10

      SHORT FADES + CUTS

      STRAUM 10 GETS 450 MS.
    */

    [
      ["djup",   7, 360, "fade", 120],
      ["straum", 7, 280, "cut",    0],
      ["straum", 8, 250, "cut",    0],
      ["djup",   8, 420, "fade", 140],
      ["straum", 8, 250, "cut",    0],
      ["straum",10, 450, "fade", 100],
      ["djup",   9, 490, "fade", 160]
    ].forEach(([product, n, ms, effect, fade]) => {
      frame(
        "light", product, n,
        ms, effect, fade
      );
    });

    /*
      ==========================================
      02 / LIGHT HOLD

      00:10 - 00:14
      STATIC DJUP LIGHT 10
      ==========================================
    */

    frame(
      "light", "djup", 10,
      4000, "hold"
    );

    /*
      ==========================================
      03 / LIGHT TO DARK

      00:14 - 00:16

      GHOST WITHIN SAME COLOR.
      CLEAN CUT ACROSS COLORS.
      ==========================================
    */

    [
      ["light", "djup",   8, 250, "ghost", 140],
      ["light", "djup",   7, 230, "ghost", 130],
      ["dark",  "djup",   1, 250, "cut",     0],
      ["dark",  "djup",   3, 270, "ghost", 140],
      ["dark",  "straum", 3, 250, "fade",  100],
      ["light", "djup",   6, 400, "cut",     0],
      ["dark",  "djup",   5, 350, "cut",     0]
    ].forEach(([state, product, n, ms, effect, fade]) => {
      frame(
        state, product, n,
        ms, effect, fade
      );
    });

    /*
      00:16 - 00:17.50

      FAST CUTS
      VARIABLE 180 - 240 MS
    */

    [
      ["dark",  "djup",   6, 230],
      ["dark",  "djup",   4, 190],
      ["dark",  "straum", 5, 210],
      ["dark",  "straum", 4, 180],
      ["light", "straum", 4, 220],
      ["dark",  "djup",   7, 240],
      ["dark",  "djup",   8, 230]
    ].forEach(([state, product, n, ms]) => {
      frame(
        state, product, n,
        ms, "cut"
      );
    });

    /*
      00:17.50 - 00:20

      VARIABLE CUTS

      LIGHT DJUP 08 HELD 400 MS.
      DARK STRAUM 10 HELD 450 MS.
    */

    [
      ["dark",  "straum", 7, 280],
      ["dark",  "straum", 6, 260],
      ["dark",  "djup",   8, 370],
      ["light", "djup",   8, 400],
      ["dark",  "straum", 9, 290],
      ["dark",  "straum",10, 450],
      ["dark",  "djup",   9, 450]
    ].forEach(([state, product, n, ms]) => {
      frame(
        state, product, n,
        ms, "cut"
      );
    });

    /*
      ==========================================
      04 / DARK HOLD

      00:20 - 00:24
      STATIC DJUP DARK 10
      ==========================================
    */

    frame(
      "dark", "djup", 10,
      4000, "hold"
    );

    /*
      ==========================================
      05 / TRANSITION BACK TO LIGHT

      00:24 - 00:26

      SEVEN FRAMES
      VARIABLE CLEAN CUTS
      ==========================================
    */

    [
      ["dark",  "djup",   9, 260],
      ["dark",  "djup",   7, 270],
      ["dark",  "djup",   6, 300],
      ["dark",  "straum", 5, 270],
      ["light", "straum",10, 310],
      ["light", "djup",   8, 300],
      ["dark",  "djup",   5, 290]
    ].forEach(([state, product, n, ms]) => {
      frame(
        state, product, n,
        ms, "cut"
      );
    });

    /*
      00:26 - 00:28

      CUTS FIRST.
      GHOST AT THE END.

      LAST FRAME: LIGHT BG
      SAME IMAGE AS LOOP START.
    */

    [
      ["light", "djup",   6, 220, "cut",     0],
      ["dark",  "djup",   3, 230, "cut",     0],
      ["light", "djup",   4, 270, "cut",     0],
      ["light", "straum", 6, 200, "cut",     0],
      ["light", "djup",   2, 320, "ghost", 170],
      ["light", "djup",   1, 280, "ghost", 180],
      ["light", "bg",     0, 480, "ghost", 320]
    ].forEach(([state, product, n, ms, effect, fade]) => {
      frame(
        state, product, n,
        ms, effect, fade
      );
    });

    /*
      ==========================================
      MOBILE V5

      ORIGINAL THREE STATES
      NORMAL / LIGHT / DARK

      10 SECOND HOLDS
      3 SECOND TRANSITIONS
      39 SECOND TOTAL LOOP
      ==========================================
    */

    const MOBILE_VERSION = "v5";

    const mobileStates = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-"
      },

      dark: {
        master: "skaldstudio-mobile-dark.webp",
        prefix: "skaldstudio-mobile-dark-character-"
      }
    };

    function mobileFrame(state, number) {
      return (
        mobileStates[state].prefix +
        String(number).padStart(2, "0") +
        ".webp?" +
        MOBILE_VERSION
      );
    }

    function mobileMaster(state) {
      return (
        mobileStates[state].master +
        "?" +
        MOBILE_VERSION
      );
    }

    function mobileFilter(frame, from, to) {
      if (
        frame.state !== to ||
        ![4, 6].includes(frame.number)
      ) {
        return null;
      }

      if (from === "normal" && to === "light") {
        return "brightness(1.08) blur(0.8px)";
      }

      if (from === "light" && to === "dark") {
        return "brightness(0.88) contrast(1.10) blur(0.5px)";
      }

      if (from === "dark" && to === "normal") {
        return "brightness(0.96) blur(0.4px)";
      }

      return null;
    }

    function buildMobileTransition(from, to) {
      const frames = [];

      /*
        FORWARD: 01 TO 09
      */

      for (let n = 1; n <= 9; n++) {
        frames.push({
          state: from,
          number: n,
          src: mobileFrame(from, n)
        });
      }

      /*
        REVERSE WITH NEXT COLOR FRAMES
      */

      const reverse = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of reverse) {
        frames.push({
          state,
          number,
          src: mobileFrame(state, number)
        });
      }

      frames.push({
        state: to,
        number: 0,
        src: mobileMaster(to)
      });

      const frameDuration =
        3000 / frames.length;

      let backgroundChanged = false;

      return frames.map(frame => {
        const step = {
          src: frame.src,
          ms: frameDuration,
          effect: "fade",
          fade: 70,
          filterStart: mobileFilter(
            frame, from, to
          )
        };

        if (
          !backgroundChanged &&
          frame.state === to
        ) {
          step.background = to;
          backgroundChanged = true;
        }

        return step;
      });
    }

    const mobileSteps = [];

    function mobileHold(state) {
      mobileSteps.push({
        src: mobileMaster(state),
        ms: 10000,
        effect: "hold",
        background: state
      });
    }

    mobileHold("normal");

    mobileSteps.push(
      ...buildMobileTransition(
        "normal", "light"
      )
    );

    mobileHold("light");

    mobileSteps.push(
      ...buildMobileTransition(
        "light", "dark"
      )
    );

    mobileHold("dark");

    mobileSteps.push(
      ...buildMobileTransition(
        "dark", "normal"
      )
    );

    /*
      ==========================================
      SAFETY CHECKS
      ==========================================
    */

    function totalDuration(steps) {
      return Math.round(
        steps.reduce(
          (total, step) => total + step.ms,
          0
        )
      );
    }

    console.assert(
      totalDuration(desktopSteps) === DESKTOP_DURATION,
      "Desktop duration must equal 28000 ms"
    );

    console.assert(
      totalDuration(mobileSteps) === MOBILE_DURATION,
      "Mobile duration must equal 39000 ms"
    );

    /*
      ==========================================
      RESPONSIVE START / RESTART
      ==========================================
    */

    async function startPlayback(id, mode) {
      const steps =
        mode === "mobile"
          ? mobileSteps
          : desktopSteps;

      const duration =
        mode === "mobile"
          ? MOBILE_DURATION
          : DESKTOP_DURATION;

      const ready = await preloadImages(steps);

      if (!isActive(id, mode) || !ready) {
        return;
      }

      playTimeline(
        steps,
        duration,
        id,
        mode
      );
    }

    function restartAnimation() {
      runId++;

      clearOverlay();

      const mode = currentMode();

      desktopTone = "light";

      if (mode === "mobile") {
        mobileBase.src =
          "skaldstudio-mobile-normal.webp";

        setBackground("normal");
      } else {
        desktopBase.src =
          reducedMotion.matches
            ? "skaldstudio-desktop-light-djup-10.webp"
            : "skaldstudio-desktop-light-bg.webp";

        setBackground("light");
      }

      if (
        document.hidden ||
        reducedMotion.matches
      ) {
        return;
      }

      startPlayback(runId, mode);
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    /*
      START V10
    */

    restartAnimation();
  </script>
</body>
</html>
