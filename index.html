
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description" content="SKALD STUDIO is an independent design practice specializing in brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#88797a">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #88797a;
    }

    body {
      display: grid;
      place-items: center;
      height: 100vh;
      height: 100dvh;
    }

    .page {
      position: relative;
      width: min(100vw, 180dvh);
      aspect-ratio: 9 / 5;
      overflow: hidden;
    }

    picture, picture img {
      display: block;
      width: 100%;
      height: 100%;
    }

    picture img {
      object-fit: contain;
    }

    .contact {
      position: absolute;
      left: 73%;
      top: 64%;
      width: 23%;
      height: 7%;
      z-index: 2;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      .page {
        width: min(100vw, 52.7027dvh);
        aspect-ratio: 39 / 74;
      }

      .contact {
        left: 4%;
        top: 81%;
        width: 48%;
        height: 8%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-normal.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>
</body>
</html>
