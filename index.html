
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description" content="SKALD STUDIO is an independent design practice specializing in brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#88797a">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: #88797a;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #88797a;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture {
      display: block;
      width: 100%;
    }

    picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* CHARACTER GLITCH / DUAL LAYER */

    .glitch-frame {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* DESKTOP CONTACT */

    .contact {
      position: absolute;
      left: 73%;
      top: 63%;
      width: 24%;
      height: 9%;
      z-index: 10;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }

      .glitch-frame {
        display: block;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      .glitch-frame {
        display: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- RESPONSIVE NORMAL STATE -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-normal.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- CHARACTER GLITCH / TWO LAYERS -->

    <img
      id="glitch-a"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <img
      id="glitch-b"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- CONTACT -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO
      CHARACTER GLITCH V3 / CROSSFADE

      00–10s    NORMAL
      10–12.5s  CHARACTER GLITCH
      12.5–20s  NORMAL
      20–22s    RESERVED / PAGE FLICKER
      22s       REPEAT
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const layers = [
      document.getElementById("glitch-a"),
      document.getElementById("glitch-b")
    ];

    /* ANIMATION SETTINGS */

    const GLITCH_DURATION = 2500;
    const CROSSFADE_DURATION = 70;

    const NORMAL_BEFORE = 10000;
    const NORMAL_AFTER = 7500;
    const PAGE_FLICKER_RESERVED = 2000;

    /* NINE CHARACTER FRAMES */

    const frames = Array.from({ length: 9 }, (_, i) =>
      `skaldstudio-mobile-character-${String(i + 1).padStart(2, "0")}.webp?v=2`
    );

    /* FORWARD AND REVERSE */

    const sequence = [
      ...frames,
      ...frames.slice(0, -1).reverse()
    ];

    /*
      17 FRAME VIEWS
      CROSSFADE + HOLD
      TOTAL APPROXIMATELY 2.5 SECONDS
    */

    const FRAME_STEP = (
      GLITCH_DURATION - CROSSFADE_DURATION
    ) / sequence.length;

    const FRAME_HOLD = Math.max(
      0,
      FRAME_STEP - CROSSFADE_DURATION
    );

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    let runId = 0;
    let activeLayer = null;
    let preloadPromise = null;

    /* CHECK ACTIVE VIEW */

    function isActive(id) {
      return (
        id === runId &&
        portrait.matches &&
        !reducedMotion.matches &&
        !document.hidden
      );
    }

    /* RESET ANIMATION */

    function resetLayers() {
      layers.forEach(layer => {
        layer.style.transition = "none";
        layer.style.opacity = "0";
        layer.style.zIndex = "1";
      });

      activeLayer = null;
    }

    /* PRELOAD ALL IMAGES */

    function preloadFrames() {
      if (!preloadPromise) {
        preloadPromise = Promise.all(
          frames.map(src => new Promise(resolve => {
            const img = new Image();

            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);

            img.src = src;
          }))
        );
      }

      return preloadPromise;
    }

    /*
      CROSSFADE TO NEXT FRAME
      PREVIOUS FRAME REMAINS VISIBLE
      WHILE NEXT FRAME FADES IN
    */

    async function crossfadeTo(src, id) {
      if (!isActive(id)) return false;

      const previous = activeLayer;

      const incoming =
        previous === layers[0]
          ? layers[1]
          : layers[0];

      incoming.style.transition = "none";
      incoming.style.opacity = "0";
      incoming.style.zIndex = "3";

      if (previous) {
        previous.style.zIndex = "2";
      }

      incoming.src = src;

      /* Apply initial opacity before transition */

      void incoming.offsetWidth;

      incoming.style.transition =
        `opacity ${CROSSFADE_DURATION}ms linear`;

      incoming.style.opacity = "1";

      await wait(CROSSFADE_DURATION);

      if (!isActive(id)) return false;

      if (previous) {
        previous.style.transition = "none";
        previous.style.opacity = "0";
      }

      activeLayer = incoming;

      return true;
    }

    /* RETURN SMOOTHLY TO NORMAL */

    async function fadeToNormal(id) {
      if (!isActive(id)) return false;

      if (activeLayer) {
        activeLayer.style.transition =
          `opacity ${CROSSFADE_DURATION}ms linear`;

        activeLayer.style.opacity = "0";

        await wait(CROSSFADE_DURATION);
      }

      if (!isActive(id)) return false;

      resetLayers();
      return true;
    }

    /* PLAY CHARACTER SEQUENCE */

    async function runCharacterGlitch(id) {
      for (const src of sequence) {
        if (!isActive(id)) return false;

        const success = await crossfadeTo(src, id);

        if (!success) return false;

        await wait(FRAME_HOLD);
      }

      return await fadeToNormal(id);
    }

    /* MAIN LOOP */

    async function playAnimation(id) {
      if (!isActive(id)) return;

      const loaded = await preloadFrames();

      if (!isActive(id) || !loaded.every(Boolean)) {
        return;
      }

      while (isActive(id)) {

        /* 01 / NORMAL STATE */

        await wait(NORMAL_BEFORE);

        if (!isActive(id)) break;

        /* 02 / CHARACTER GLITCH */

        const completed = await runCharacterGlitch(id);

        if (!completed || !isActive(id)) break;

        /* 03 / NORMAL STATE */

        await wait(NORMAL_AFTER);

        if (!isActive(id)) break;

        /* 04 / RESERVED FOR PAGE FLICKER */

        await wait(PAGE_FLICKER_RESERVED);
      }
    }

    /* RESTART ON VIEW CHANGE */

    function restartAnimation() {
      runId++;

      resetLayers();

      if (
        portrait.matches &&
        !reducedMotion.matches &&
        !document.hidden
      ) {
        playAnimation(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    /* INITIAL START */

    restartAnimation();
  </script>

</body>
</html>
