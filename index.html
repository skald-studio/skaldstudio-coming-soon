
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
        content="SKALD STUDIO. Independent design practice. Brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#c7c8c5">

  <style>
    :root {
      --site-bg: #c7c8c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--site-bg);
      transition: background-color 480ms ease-in-out;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture,
    picture img {
      display: block;
      width: 100%;
    }

    picture img {
      height: auto;
    }

    .animation-frame,
    .echo-frame,
    .signal-slice {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0;
    }

    .animation-frame {
      z-index: 1;
    }

    .echo-frame {
      z-index: 5;
    }

    .signal-slice {
      z-index: 6;
      will-change: transform, opacity;
    }

    /*
      GLITCH ONLY IN CENTRAL PRODUCT AREA.
      STATIC TYPE AND CONTACT REMAIN IN PLACE.
    */

    #signal-a {
      clip-path: inset(17% 18% 57% 35%);
      mix-blend-mode: screen;
    }

    #signal-b {
      clip-path: inset(53% 19% 24% 36%);
      mix-blend-mode: normal;
    }

    /*
      CONTACT HOTSPOT MATCHED TO
      DESKTOP ARTWORK POSITION
    */

    .contact {
      display: block;
      position: absolute;
      left: 80.4%;
      top: 64.6%;
      width: 16%;
      height: 11%;
      z-index: 30;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }

    .contact:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /*
      MOBILE PORTRAIT RETAINS V5
    */

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }

      .echo-frame,
      .signal-slice {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html,
      body {
        transition: none !important;
      }

      .animation-frame,
      .echo-frame,
      .signal-slice {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- RESPONSIVE BASE -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-light-djup-10.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- MAIN FRAME LAYERS -->

    <img
      id="frame-a"
      class="animation-frame"
      alt=""
      aria-hidden="true"
    >

    <img
      id="frame-b"
      class="animation-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- CONTROLLED COLOR ECHO -->

    <img
      id="echo-frame"
      class="echo-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- STRAUM SIGNAL DISPLACEMENT -->

    <img
      id="signal-a"
      class="signal-slice"
      alt=""
      aria-hidden="true"
    >

    <img
      id="signal-b"
      class="signal-slice"
      alt=""
      aria-hidden="true"
    >

    <!-- PERMANENT CONTACT -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Email SKALD STUDIO"
      title="contact@skaldstudio.com"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO V8

      DESKTOP
      LIGHT HOLD 10S
      LIGHT TO DARK APPROX 8S
      DARK HOLD 10S
      DARK TO LIGHT APPROX 7.4S

      MOBILE PORTRAIT
      ORIGINAL V5 SEQUENCE
      NORMAL / LIGHT / DARK
      39 SECOND LOOP
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const layers = [
      document.getElementById("frame-a"),
      document.getElementById("frame-b")
    ];

    const echoLayer =
      document.getElementById("echo-frame");

    const signalLayers = [
      document.getElementById("signal-a"),
      document.getElementById("signal-b")
    ];

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    const COLORS = {
      normal: "#88797a",
      light: "#c7c8c5",
      dark: "#292b2b"
    };

    const imageCache = new Map();

    let runId = 0;
    let activeLayer = null;

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    function mode() {
      return portrait.matches ? "mobile" : "desktop";
    }

    function active(id, expectedMode) {
      return (
        id === runId &&
        mode() === expectedMode &&
        !reducedMotion.matches &&
        !document.hidden
      );
    }

    /* BACKGROUND CONTROL */

    function setBackground(state, instant = false) {
      const root = document.documentElement;

      if (instant) {
        root.style.transition = "none";
        document.body.style.transition = "none";
      }

      root.style.setProperty(
        "--site-bg",
        COLORS[state]
      );

      if (themeColor) {
        themeColor.setAttribute(
          "content",
          COLORS[state]
        );
      }

      if (instant) {
        void document.body.offsetWidth;

        root.style.transition = "";
        document.body.style.transition = "";
      }
    }

    /* RESET */

    function resetLayers() {
      for (const layer of layers) {
        layer.style.transition = "none";
        layer.style.opacity = "0";
        layer.style.zIndex = "1";
        layer.style.filter = "none";
      }

      echoLayer.style.transition = "none";
      echoLayer.style.opacity = "0";

      for (const layer of signalLayers) {
        layer.getAnimations().forEach(
          animation => animation.cancel()
        );

        layer.style.opacity = "0";
      }

      activeLayer = null;
    }

    /* IMAGE PRELOADING */

    function preloadImages(paths) {
      const unique = [...new Set(paths)];

      return Promise.all(
        unique.map(src => {
          if (imageCache.has(src)) {
            return imageCache.get(src);
          }

          const image = new Image();

          const promise = new Promise(resolve => {
            image.onload = async () => {
              if (typeof image.decode === "function") {
                try {
                  await image.decode();
                } catch (error) {
                  // Loaded image can still be used.
                }
              }

              resolve(true);
            };

            image.onerror = () => {
              console.error(
                "Image loading failed:",
                src
              );

              resolve(false);
            };

            image.src = src;
          });

          imageCache.set(src, promise);

          return promise;
        })
      ).then(results => results.every(Boolean));
    }

    /* MAIN FRAME TRANSITION */

    async function showFrame(step, id, expectedMode) {
      if (!active(id, expectedMode)) {
        return false;
      }

      const previous = activeLayer;

      const incoming =
        previous === layers[0]
          ? layers[1]
          : layers[0];

      const duration = step.ms;
      const fade = Math.min(
        step.fade ?? 90,
        Math.max(40, duration - 20)
      );

      if (step.background) {
        setBackground(step.background);
      }

      incoming.style.transition = "none";
      incoming.style.opacity = "0";
      incoming.style.zIndex = "3";

      incoming.style.filter =
        step.filterStart || "none";

      incoming.src = step.src;

      if (previous) {
        previous.style.zIndex = "2";
      }

      void incoming.offsetWidth;

      incoming.style.transition =
        `opacity ${fade}ms ease-in-out,
         filter ${fade}ms ease-out`;

      incoming.style.opacity = "1";
      incoming.style.filter = "none";

      if (step.glitch) {
        triggerGlitch(step.glitch);
      }

      await wait(duration);

      if (!active(id, expectedMode)) {
        return false;
      }

      if (previous) {
        previous.style.transition = "none";
        previous.style.opacity = "0";
        previous.style.zIndex = "1";
      }

      activeLayer = incoming;

      return true;
    }

    async function playSteps(steps, id, expectedMode) {
      for (const step of steps) {
        const ok = await showFrame(
          step,
          id,
          expectedMode
        );

        if (!ok) return false;
      }

      return active(id, expectedMode);
    }

    /* =====================================
       STRAUM SIGNAL INTERFERENCE

       TWO DISPLACED IMAGE STRIPS
       LOCALIZED TO PRODUCT AREA
       ===================================== */

    function triggerGlitch(source) {
      signalLayers.forEach((layer, index) => {
        layer.getAnimations().forEach(
          animation => animation.cancel()
        );

        layer.src = source;

        const direction =
          index === 0 ? 1 : -1;

        const shift =
          index === 0 ? 14 : 9;

        const duration =
          index === 0 ? 235 : 190;

        layer.animate(
          [
            {
              opacity: 0,
              transform: "translate3d(0,0,0)",
              filter: "contrast(1.1)"
            },
            {
              opacity: index === 0 ? 0.66 : 0.49,
              transform:
                `translate3d(${direction * shift}px,0,0)`,
              filter:
                "contrast(1.4) brightness(1.16)"
            },
            {
              opacity: 0.3,
              transform:
                `translate3d(${-direction * 5}px,0,0)`,
              filter: "contrast(1.22)"
            },
            {
              opacity: 0,
              transform: "translate3d(0,0,0)",
              filter: "none"
            }
          ],
          {
            duration,
            easing: "steps(3, end)",
            fill: "none"
          }
        );
      });
    }

    /* =====================================
       COLOR ECHO

       COMPLETE PRODUCT FRAME IS VISIBLE
       LONG ENOUGH TO BE RECOGNIZED.
       ===================================== */

    async function showEcho(
      src,
      settings,
      id,
      expectedMode
    ) {
      if (!active(id, expectedMode)) {
        return false;
      }

      const rise = settings.rise ?? 240;
      const hold = settings.hold ?? 700;
      const fall = settings.fall ?? 470;
      const opacity = settings.opacity ?? 0.54;

      echoLayer.style.transition = "none";
      echoLayer.style.opacity = "0";
      echoLayer.src = src;

      void echoLayer.offsetWidth;

      echoLayer.style.transition =
        `opacity ${rise}ms ease-in-out`;

      echoLayer.style.opacity =
        String(opacity);

      await wait(rise + hold);

      if (!active(id, expectedMode)) {
        return false;
      }

      echoLayer.style.transition =
        `opacity ${fall}ms ease-in-out`;

      echoLayer.style.opacity = "0";

      await wait(fall);

      return active(id, expectedMode);
    }

    /* =====================================
       DESKTOP FILES
       40 PRODUCT IMAGES
       NO BACKGROUND IMAGE FILES
       ===================================== */

    function desktopFrame(state, product, number) {
      return (
        "skaldstudio-desktop-" +
        state + "-" +
        product + "-" +
        String(number).padStart(2, "0") +
        ".webp"
      );
    }

    function desktopPreloadPaths() {
      const paths = [];

      for (const state of ["light", "dark"]) {
        for (let n = 1; n <= 10; n++) {
          paths.push(
            desktopFrame(state, "djup", n)
          );

          paths.push(
            desktopFrame(state, "straum", n)
          );
        }
      }

      return paths;
    }

    function addStep(
      steps,
      state,
      product,
      number,
      ms,
      fade,
      options = {}
    ) {
      steps.push({
        src: desktopFrame(
          state,
          product,
          number
        ),
        ms,
        fade,
        ...options
      });
    }

    /* =====================================
       FREQUENCY 01

       LIGHT TO DARK

       SLOW DJUP LOSS
       STRAUM REVEAL
       INTERRUPTED DARK SIGNAL
       DARK DJUP RECONSTRUCTION
       FINAL LIGHT ECHO

       ALL 40 IMAGES USED HERE
       ===================================== */

    async function lightToDark(id) {
      const steps = [];

      /* DJUP LIGHT / DISSOLVE */

      for (let n = 10; n >= 1; n--) {
        addStep(
          steps,
          "light",
          "djup",
          n,
          125,
          95
        );
      }

      /* STRAUM LIGHT / REVEAL */

      for (let n = 1; n <= 10; n++) {
        addStep(
          steps,
          "light",
          "straum",
          n,
          n === 10 ? 650 : 135,
          n === 10 ? 180 : 75,
          {
            glitch:
              [3, 7, 9].includes(n)
                ? desktopFrame(
                    "dark",
                    "straum",
                    n
                  )
                : null
          }
        );
      }

      /* STRAUM DARK / SIGNAL CHANGE */

      for (let n = 1; n <= 10; n++) {
        addStep(
          steps,
          "dark",
          "straum",
          n,
          n === 10 ? 540 : 130,
          n === 1 ? 180 : 85,
          {
            background:
              n === 1 ? "dark" : null,

            glitch:
              [2, 6, 9].includes(n)
                ? desktopFrame(
                    "light",
                    "straum",
                    n
                  )
                : null
          }
        );
      }

      /* DJUP DARK / MATERIALIZATION */

      for (let n = 1; n <= 10; n++) {
        addStep(
          steps,
          "dark",
          "djup",
          n,
          168,
          125
        );
      }

      const completed = await playSteps(
        steps,
        id,
        "desktop"
      );

      if (!completed) return false;

      /* RECOGNIZABLE LIGHT RETURN */

      return showEcho(
        desktopFrame("light", "djup", 10),
        {
          opacity: 0.56,
          rise: 240,
          hold: 760,
          fall: 470
        },
        id,
        "desktop"
      );
    }

    /* =====================================
       FREQUENCY 02

       DARK TO LIGHT

       FRAGMENTED DJUP LOSS
       NONLINEAR STRAUM INTERRUPTIONS
       EARLY LIGHT LEAK
       RETURNING DARK SIGNAL
       LIGHT PRODUCT RECOVERY
       FINAL DARK STRAUM ECHO

       DIFFERENT STRUCTURE AND TIMING
       ===================================== */

    async function darkToLight(id) {
      const steps = [];

      /* DJUP DARK / CONTROLLED DEGRADATION */

      for (const n of [10, 9, 8, 7]) {
        addStep(
          steps,
          "dark",
          "djup",
          n,
          180,
          115
        );
      }

      /* STRAUM DARK / FIRST INTERRUPTION */

      for (const n of [10, 8, 6, 4, 2]) {
        addStep(
          steps,
          "dark",
          "straum",
          n,
          165,
          90,
          {
            glitch:
              [8, 4].includes(n)
                ? desktopFrame(
                    "light",
                    "straum",
                    n
                  )
                : null
          }
        );
      }

      /* DJUP COLLAPSE */

      for (const n of [6, 4, 2, 1]) {
        addStep(
          steps,
          "dark",
          "djup",
          n,
          150,
          100
        );
      }

      /* PREMATURE LIGHT SIGNAL */

      for (const n of [1, 3, 5]) {
        addStep(
          steps,
          "light",
          "djup",
          n,
          190,
          125,
          {
            background:
              n === 1 ? "light" : null
          }
        );
      }

      /* DARK STRAUM BREAKS THROUGH AGAIN */

      for (const n of [1, 3, 5]) {
        addStep(
          steps,
          "dark",
          "straum",
          n,
          135,
          80,
          {
            glitch: desktopFrame(
              "light",
              "straum",
              n
            )
          }
        );
      }

      /* LIGHT STRAUM APPEARS NONLINEARLY */

      for (const n of [1, 2, 4, 7, 10]) {
        addStep(
          steps,
          "light",
          "straum",
          n,
          n === 10 ? 650 : 180,
          n === 10 ? 200 : 105,
          {
            glitch:
              [4, 7].includes(n)
                ? desktopFrame(
                    "dark",
                    "straum",
                    n
                  )
                : null
          }
        );
      }

      /* LAST DARK SIGNAL INTERRUPTION */

      addStep(
        steps,
        "dark",
        "straum",
        8,
        230,
        85,
        {
          glitch: desktopFrame(
            "light",
            "straum",
            9
          )
        }
      );

      addStep(
        steps,
        "light",
        "straum",
        9,
        250,
        135
      );

      /* DJUP LIGHT RECONSTRUCTION */

      for (let n = 6; n <= 10; n++) {
        addStep(
          steps,
          "light",
          "djup",
          n,
          200,
          145
        );
      }

      const completed = await playSteps(
        steps,
        id,
        "desktop"
      );

      if (!completed) return false;

      /* DARK STRAUM REMAINS AS AFTERIMAGE */

      return showEcho(
        desktopFrame("dark", "straum", 10),
        {
          opacity: 0.54,
          rise: 230,
          hold: 690,
          fall: 500
        },
        id,
        "desktop"
      );
    }

    /* =====================================
       DESKTOP LOOP
       ===================================== */

    async function playDesktop(id) {
      const startup = await Promise.all([
        wait(10000),
        preloadImages(
          desktopPreloadPaths()
        )
      ]);

      if (
        !active(id, "desktop") ||
        !startup[1]
      ) {
        return;
      }

      while (active(id, "desktop")) {
        const first = await lightToDark(id);

        if (!first) break;

        await wait(10000);

        if (!active(id, "desktop")) break;

        const second = await darkToLight(id);

        if (!second) break;

        await wait(10000);
      }
    }

    /* =====================================
       MOBILE V5

       ORIGINAL NORMAL / LIGHT / DARK
       10 SECOND HOLDS
       3 SECOND TRANSITIONS
       ===================================== */

    const MOBILE_VERSION = "v5";

    const mobileStates = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-"
      },

      dark: {
        master: "skaldstudio-mobile-dark.webp",
        prefix: "skaldstudio-mobile-dark-character-"
      }
    };

    const mobileOrder = [
      "normal",
      "light",
      "dark"
    ];

    function mobileFrame(state, number) {
      return (
        mobileStates[state].prefix +
        String(number).padStart(2, "0") +
        ".webp?" +
        MOBILE_VERSION
      );
    }

    function mobileMaster(state) {
      return (
        mobileStates[state].master +
        "?" +
        MOBILE_VERSION
      );
    }

    function mobilePreloadPaths() {
      const paths = [];

      for (const state of mobileOrder) {
        paths.push(mobileMaster(state));

        for (let n = 1; n <= 9; n++) {
          paths.push(
            mobileFrame(state, n)
          );
        }
      }

      return paths;
    }

    function mobileEffect(frame, from, to) {
      if (
        frame.state !== to ||
        (frame.number !== 6 && frame.number !== 4)
      ) {
        return null;
      }

      if (from === "normal" && to === "light") {
        return "brightness(1.08) blur(0.8px)";
      }

      if (from === "light" && to === "dark") {
        return "brightness(0.88) contrast(1.10) blur(0.5px)";
      }

      if (from === "dark" && to === "normal") {
        return "brightness(0.96) blur(0.4px)";
      }

      return null;
    }

    function mobileSequence(from, to) {
      const frames = [];

      for (let n = 1; n <= 9; n++) {
        frames.push({
          state: from,
          number: n,
          src: mobileFrame(from, n)
        });
      }

      const returnFrames = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of returnFrames) {
        frames.push({
          state,
          number,
          src: mobileFrame(state, number)
        });
      }

      frames.push({
        state: to,
        number: 0,
        src: mobileMaster(to)
      });

      let changed = false;

      return frames.map(frame => {
        const step = {
          src: frame.src,
          ms: 3000 / frames.length,
          fade: 70,
          filterStart: mobileEffect(
            frame,
            from,
            to
          )
        };

        if (
          !changed &&
          frame.state === to
        ) {
          step.background = to;
          changed = true;
        }

        return step;
      });
    }

    async function playMobile(id) {
      const startup = await Promise.all([
        wait(10000),
        preloadImages(
          mobilePreloadPaths()
        )
      ]);

      if (
        !active(id, "mobile") ||
        !startup[1]
      ) {
        return;
      }

      let index = 0;

      while (active(id, "mobile")) {
        const next =
          (index + 1) % mobileOrder.length;

        const completed = await playSteps(
          mobileSequence(
            mobileOrder[index],
            mobileOrder[next]
          ),
          id,
          "mobile"
        );

        if (!completed) break;

        index = next;

        await wait(10000);
      }
    }

    /* =====================================
       RESPONSIVE CONTROL
       ===================================== */

    function restartAnimation() {
      runId++;

      resetLayers();

      const currentMode = mode();

      setBackground(
        currentMode === "mobile"
          ? "normal"
          : "light",
        true
      );

      if (
        reducedMotion.matches ||
        document.hidden
      ) {
        return;
      }

      if (currentMode === "mobile") {
        playMobile(runId);
      } else {
        playDesktop(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    restartAnimation();
  </script>
</body>
</html>
