
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
        content="SKALD STUDIO. Independent design practice. Brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#c7c8c5">

  <style>
    :root {
      --site-bg: #c7c8c5;
      --bg-duration: 520ms;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--site-bg);
      transition: background-color var(--bg-duration) ease;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--site-bg);
      transition: background-color var(--bg-duration) ease;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture,
    picture img {
      display: block;
      width: 100%;
    }

    picture img {
      height: auto;
    }

    .animation-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* CONTACT IS ALWAYS ABOVE THE ANIMATION */

    .contact {
      display: block;
      position: absolute;
      left: 70%;
      top: 57%;
      width: 28%;
      height: 25%;
      z-index: 99;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }

    .contact:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html,
      body {
        transition: none !important;
      }

      .animation-frame {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- STATIC RESPONSIVE STARTING IMAGE -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-light-djup-10.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- ANIMATION LAYERS -->

    <img
      id="frame-a"
      class="animation-frame"
      alt=""
      aria-hidden="true"
    >

    <img
      id="frame-b"
      class="animation-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- PERMANENT CONTACT LINK -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
      title="contact@skaldstudio.com"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO / ANIMATION V7

      DESKTOP
      00–10 LIGHT
      10–16 LIGHT TO DARK
      16–26 DARK
      26–32 DARK TO LIGHT
      REPEAT

      MOBILE PORTRAIT
      ORIGINAL V5 / 39 SECOND LOOP
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const layers = [
      document.getElementById("frame-a"),
      document.getElementById("frame-b")
    ];

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    const COLORS = {
      normal: "#88797a",
      light: "#c7c8c5",
      dark: "#292b2b"
    };

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    let runId = 0;
    let activeLayer = null;

    let imageCache = new Map();

    function currentMode() {
      return portrait.matches ? "mobile" : "desktop";
    }

    function isActive(id, mode) {
      return (
        id === runId &&
        currentMode() === mode &&
        !reducedMotion.matches &&
        !document.hidden
      );
    }

    /* BACKGROUND COLOR */

    function setBackground(color, instant = false) {
      const root = document.documentElement;

      if (instant) {
        root.style.transition = "none";
        document.body.style.transition = "none";
      }

      root.style.setProperty("--site-bg", color);

      if (themeColor) {
        themeColor.setAttribute("content", color);
      }

      if (instant) {
        void document.body.offsetWidth;

        root.style.transition = "";
        document.body.style.transition = "";
      }
    }

    /* RESET */

    function resetLayers() {
      layers.forEach(layer => {
        layer.style.transition = "none";
        layer.style.opacity = "0";
        layer.style.filter = "none";
        layer.style.zIndex = "1";
      });

      activeLayer = null;
    }

    /* IMAGE PRELOADING */

    function preloadImages(paths) {
      const unique = [...new Set(paths)];

      return Promise.all(
        unique.map(src => {
          if (imageCache.has(src)) {
            return imageCache.get(src).promise;
          }

          const image = new Image();

          const promise = new Promise(resolve => {
            image.onload = () => resolve(true);

            image.onerror = () => {
              console.error("Image not loaded:", src);
              resolve(false);
            };
          });

          imageCache.set(src, { image, promise });
          image.src = src;

          return promise;
        })
      ).then(results => results.every(Boolean));
    }

    /*
      SHARED TRANSITION ENGINE

      Two image layers.
      Individual timing per frame.
      Adjustable opacity and fade.
      No movement of the page layout.
    */

    async function showFrame(step, id, mode) {
      if (!isActive(id, mode)) return false;

      const previous = activeLayer;

      const incoming =
        previous === layers[0]
          ? layers[1]
          : layers[0];

      const fade = step.fade ?? 70;
      const opacity = step.opacity ?? 1;

      if (step.background) {
        setBackground(step.background);
      }

      incoming.style.transition = "none";
      incoming.style.opacity = "0";
      incoming.style.zIndex = "3";
      incoming.style.filter =
        step.filterStart || "none";

      incoming.src = step.src;

      if (previous) {
        previous.style.zIndex = "2";
      }

      void incoming.offsetWidth;

      const filterDuration =
        step.filterDuration ?? fade;

      const easing =
        step.easing || "cubic-bezier(.22,.61,.36,1)";

      incoming.style.transition =
        `opacity ${fade}ms ${easing},
         filter ${filterDuration}ms ease-out`;

      incoming.style.opacity = String(opacity);
      incoming.style.filter = "none";

      await wait(step.ms);

      if (!isActive(id, mode)) return false;

      if (previous) {
        previous.style.transition = "none";
        previous.style.opacity = "0";
        previous.style.zIndex = "1";
      }

      activeLayer = incoming;

      return true;
    }

    async function playSteps(steps, id, mode) {
      for (const step of steps) {
        if (!isActive(id, mode)) return false;

        const completed = await showFrame(
          step,
          id,
          mode
        );

        if (!completed) return false;
      }

      return isActive(id, mode);
    }

    /* =====================================
       DESKTOP V7
       DJUP + STRAUM / ALL 42 IMAGES
       ===================================== */

    const DESKTOP_VERSION = "v7";

    function desktopFrame(state, product, number) {
      return (
        "skaldstudio-desktop-" +
        state + "-" +
        product + "-" +
        String(number).padStart(2, "0") +
        ".webp?" +
        DESKTOP_VERSION
      );
    }

    function desktopBackground(state) {
      return (
        "skaldstudio-desktop-" +
        state +
        "-bg.webp?" +
        DESKTOP_VERSION
      );
    }

    /*
      EACH SIX SECOND TRANSITION

      1. DJUP DISSOLVE           1500ms
      2. STRAUM OUTGOING         550ms
      3. CURRENT BACKGROUND      180ms
      4. NEW BACKGROUND          520ms
      5. STRAUM INCOMING         550ms
      6. DJUP MATERIALIZATION   2180ms
      7. COLOR ECHO              520ms

      TOTAL                     6000ms
    */

    function desktopSequence(from, to) {
      const steps = [];

      /* 01 / DJUP DISSOLVES */

      for (let n = 10; n >= 1; n--) {
        steps.push({
          src: desktopFrame(from, "djup", n),
          ms: 150,
          fade: 95
        });
      }

      /* 02 / FIRST STRAUM INTERRUPTION */

      for (let n = 6; n <= 10; n++) {
        steps.push({
          src: desktopFrame(from, "straum", n),
          ms: 110,
          fade: 45
        });
      }

      /* 03 / PRODUCT DISAPPEARS */

      steps.push({
        src: desktopBackground(from),
        ms: 180,
        fade: 130
      });

      /* 04 / BACKGROUND TRANSFORMS */

      steps.push({
        src: desktopBackground(to),
        ms: 520,
        fade: 460,
        background: COLORS[to]
      });

      /* 05 / SECOND STRAUM INTERRUPTION */

      for (let n = 1; n <= 5; n++) {
        steps.push({
          src: desktopFrame(to, "straum", n),
          ms: 110,
          fade: 50
        });
      }

      /* 06 / DJUP MATERIALIZES */

      for (let n = 1; n <= 10; n++) {
        steps.push({
          src: desktopFrame(to, "djup", n),
          ms: 218,
          fade: 145
        });
      }

      /*
        07 / COLOR ECHO

        A brief return of the previous state.
        Low opacity prevents a harsh flash.
        Then the incoming state stabilizes.
      */

      steps.push({
        src: desktopFrame(from, "djup", 9),
        ms: 180,
        fade: 120,
        opacity: 0.24
      });

      steps.push({
        src: desktopFrame(to, "djup", 10),
        ms: 340,
        fade: 240,
        opacity: 1
      });

      return steps;
    }

    /*
      ALL 42 UNIQUE DESKTOP FILES

      2 BACKGROUNDS
      20 DJUP FRAMES
      20 STRAUM FRAMES
    */

    function desktopPreloadPaths() {
      const paths = [];

      for (const state of ["light", "dark"]) {
        paths.push(desktopBackground(state));

        for (let n = 1; n <= 10; n++) {
          paths.push(desktopFrame(state, "djup", n));
          paths.push(desktopFrame(state, "straum", n));
        }
      }

      return paths;
    }

    async function playDesktop(id) {
      /*
        Initial LIGHT state is already visible
        through the base picture element.
      */

      const startup = await Promise.all([
        wait(10000),
        preloadImages(desktopPreloadPaths())
      ]);

      if (!isActive(id, "desktop") || !startup[1]) {
        return;
      }

      let state = "light";

      while (isActive(id, "desktop")) {
        const next =
          state === "light" ? "dark" : "light";

        const completed = await playSteps(
          desktopSequence(state, next),
          id,
          "desktop"
        );

        if (!completed) break;

        state = next;

        /* TEN SECOND STATIC HOLD */

        await wait(10000);
      }
    }

    /* =====================================
       MOBILE V5
       PRESERVED THREE STATE ANIMATION
       ===================================== */

    const MOBILE_VERSION = "v5";

    const mobileStates = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-"
      },

      dark: {
        master: "skaldstudio-mobile-dark.webp",
        prefix: "skaldstudio-mobile-dark-character-"
      }
    };

    const mobileOrder = [
      "normal",
      "light",
      "dark"
    ];

    function mobileFrame(state, number) {
      return (
        mobileStates[state].prefix +
        String(number).padStart(2, "0") +
        ".webp?" +
        MOBILE_VERSION
      );
    }

    function mobileMaster(state) {
      return (
        mobileStates[state].master +
        "?" +
        MOBILE_VERSION
      );
    }

    function mobileEffect(step, from, to) {
      if (
        step.state !== to ||
        (step.number !== 6 && step.number !== 4)
      ) {
        return null;
      }

      if (from === "normal" && to === "light") {
        return {
          filter: "brightness(1.08) blur(0.8px)",
          duration: 160
        };
      }

      if (from === "light" && to === "dark") {
        return {
          filter: "brightness(0.88) contrast(1.10) blur(0.5px)",
          duration: 150
        };
      }

      if (from === "dark" && to === "normal") {
        return {
          filter: "brightness(0.96) blur(0.4px)",
          duration: 140
        };
      }

      return null;
    }

    function mobileSequence(from, to) {
      const frames = [];

      for (let n = 1; n <= 9; n++) {
        frames.push({
          state: from,
          number: n,
          src: mobileFrame(from, n)
        });
      }

      const reverse = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of reverse) {
        frames.push({
          state,
          number,
          src: mobileFrame(state, number)
        });
      }

      frames.push({
        state: to,
        number: 0,
        src: mobileMaster(to)
      });

      const frameDuration = 3000 / frames.length;
      let backgroundChanged = false;

      return frames.map(frame => {
        const effect = mobileEffect(frame, from, to);

        const step = {
          src: frame.src,
          ms: frameDuration,
          fade: 70
        };

        if (effect) {
          step.filterStart = effect.filter;
          step.filterDuration = effect.duration;
        }

        if (
          !backgroundChanged &&
          frame.state === to
        ) {
          step.background = COLORS[to];
          backgroundChanged = true;
        }

        return step;
      });
    }

    function mobilePreloadPaths() {
      const paths = [];

      for (const state of mobileOrder) {
        paths.push(mobileMaster(state));

        for (let n = 1; n <= 9; n++) {
          paths.push(mobileFrame(state, n));
        }
      }

      return paths;
    }

    async function playMobile(id) {
      const startup = await Promise.all([
        wait(10000),
        preloadImages(mobilePreloadPaths())
      ]);

      if (!isActive(id, "mobile") || !startup[1]) {
        return;
      }

      let index = 0;

      while (isActive(id, "mobile")) {
        const next = (index + 1) % mobileOrder.length;

        const completed = await playSteps(
          mobileSequence(
            mobileOrder[index],
            mobileOrder[next]
          ),
          id,
          "mobile"
        );

        if (!completed) break;

        index = next;

        await wait(10000);
      }
    }

    /* =====================================
       RESPONSIVE MODE CONTROL
       ===================================== */

    function restartAnimation() {
      runId++;

      resetLayers();

      /* Release cached frames from previous mode */

      imageCache = new Map();

      const mode = currentMode();

      if (mode === "mobile") {
        setBackground(COLORS.normal, true);
      } else {
        setBackground(COLORS.light, true);
      }

      if (
        reducedMotion.matches ||
        document.hidden
      ) {
        return;
      }

      if (mode === "mobile") {
        playMobile(runId);
      } else {
        playDesktop(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    restartAnimation();
  </script>
</body>
</html>
