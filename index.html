
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description" content="SKALD STUDIO is an independent design practice specializing in brand identity, product design and development. Our new website is currently under development.">

  <meta name="theme-color" content="#e8e8e8">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #e8e8e8;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0 auto;
    }

    picture, picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    .contact {
      position: absolute;
      left: 4.2%;
      bottom: 1.5%;
      width: 25%;
      height: 5%;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid #222;
      outline-offset: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .contact {
        left: 4%;
        bottom: 4.5%;
        width: 50%;
        height: 4.5%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="sr-only">SKALD STUDIO</h1>
    <p class="sr-only">
      Independent design practice.
      Brand identity, product design and development.
      A new site is taking shape.
      Our website is currently under development.
    </p>

    <picture>
      <source
        media="(max-width: 700px)"
        srcset="skaldstudio-mobile.webp"
        type="image/webp"
      >
      <img
        src="skaldstudio-desktop.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>
  </main>
</body>
</html>
