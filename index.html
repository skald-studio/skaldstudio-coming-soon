
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description" content="SKALD STUDIO is an independent design practice specializing in brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#88797a">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: #88797a;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #88797a;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture {
      display: block;
      width: 100%;
    }

    picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* CHARACTER GLITCH OVERLAY */

    .glitch-frame {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* DESKTOP CONTACT AREA */

    .contact {
      position: absolute;
      left: 73%;
      top: 63%;
      width: 24%;
      height: 9%;
      z-index: 10;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }

      .glitch-frame {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- RESPONSIVE NORMAL STATE -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-normal.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- MOBILE CHARACTER GLITCH -->

    <img
      id="glitch-frame"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- CONTACT LINK -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO
      CHARACTER GLITCH V2

      00–10s    NORMAL
      10–12.5s  CHARACTER GLITCH
      12.5–20s  NORMAL
      20–22s    RESERVED / PAGE FLICKER
      22s       REPEAT
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const overlay = document.getElementById("glitch-frame");

    /* NINE FRAMES / CACHE VERSION 2 */

    const frames = Array.from({ length: 9 }, (_, i) =>
      `skaldstudio-mobile-character-${String(i + 1).padStart(2, "0")}.webp?v=2`
    );

    /* 01 TO 09 AND BACK TO 01 */

    const sequence = [
      ...frames,
      ...frames.slice(0, -1).reverse()
    ];

    const FRAME_DURATION = 2500 / sequence.length;

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    let framesPromise = null;
    let runId = 0;

    /* PRELOAD FRAMES */

    function preloadFrames() {
      if (!framesPromise) {
        framesPromise = Promise.all(
          frames.map(src => new Promise(resolve => {
            const img = new Image();

            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);

            img.src = src;
          }))
        );
      }

      return framesPromise;
    }

    function isActive(id) {
      return (
        id === runId &&
        portrait.matches &&
        !reducedMotion.matches
      );
    }

    /* CHARACTER ANIMATION */

    async function playGlitch() {
      const id = ++runId;

      overlay.style.opacity = "0";

      if (!isActive(id)) return;

      const loaded = await preloadFrames();

      if (!isActive(id) || !loaded.every(Boolean)) return;

      while (isActive(id)) {

        /* NORMAL / 10 SECONDS */

        await wait(10000);

        if (!isActive(id)) break;

        /* CHARACTER GLITCH / 2.5 SECONDS */

        for (const src of sequence) {
          if (!isActive(id)) break;

          overlay.src = src;
          overlay.style.opacity = "1";

          await wait(FRAME_DURATION);
        }

        /* RETURN TO NORMAL */

        overlay.style.opacity = "0";

        if (!isActive(id)) break;

        /* NORMAL / 7.5 SECONDS */

        await wait(7500);

        if (!isActive(id)) break;

        /* RESERVED FOR PAGE FLICKER / 2 SECONDS */

        await wait(2000);
      }

      overlay.style.opacity = "0";
    }

    /* RESTART ON ORIENTATION OR MOTION CHANGE */

    portrait.addEventListener("change", playGlitch);
    reducedMotion.addEventListener("change", playGlitch);

    playGlitch();
  </script>

</body>
</html>
