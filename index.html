

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
        content="SKALD STUDIO. Independent design practice. Brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#c7c8c5">

  <style>
    :root {
      --site-bg: #c7c8c5;
      --bg-fade: 450ms;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background-color: var(--site-bg);
      transition: background-color var(--bg-fade) ease-in-out;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--site-bg);
      transition: background-color var(--bg-fade) ease-in-out;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture,
    picture img {
      display: block;
      width: 100%;
    }

    picture img {
      height: auto;
    }

    /* ANIMATION LAYERS */

    .glitch-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* CONTACT LINK */

    .contact {
      position: absolute;
      left: 73%;
      top: 63%;
      width: 24%;
      height: 9%;
      z-index: 10;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      :root {
        --site-bg: #88797a;
        --bg-fade: 650ms;
      }

      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      html,
      body {
        transition: none !important;
      }

      .glitch-frame {
        display: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- RESPONSIVE MASTER IMAGES -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-light-djup-10.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- TWO ANIMATION LAYERS -->

    <img
      id="glitch-a"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <img
      id="glitch-b"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- CLICKABLE CONTACT -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO / ANIMATION V6

      DESKTOP:
      LIGHT 10s
      LIGHT TO DARK 5s
      DARK 10s
      DARK TO LIGHT 5s
      REPEAT / 30s

      MOBILE PORTRAIT:
      NORMAL 10s
      NORMAL TO LIGHT 3s
      LIGHT 10s
      LIGHT TO DARK 3s
      DARK 10s
      DARK TO NORMAL 3s
      REPEAT / 39s
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const layers = [
      document.getElementById("glitch-a"),
      document.getElementById("glitch-b")
    ];

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    const MOBILE_VERSION = "v5";
    const DESKTOP_VERSION = "v6";

    const COLORS = {
      normal: "#88797a",
      light: "#c7c8c5",
      dark: "#292b2b"
    };

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    let runId = 0;
    let activeLayer = null;

    /* DISPLAY CONTROL */

    function currentMode() {
      return portrait.matches ? "mobile" : "desktop";
    }

    function isActive(id, mode) {
      return (
        id === runId &&
        currentMode() === mode &&
        !reducedMotion.matches &&
        !document.hidden
      );
    }

    /* BACKGROUND CONTROL */

    function setBackground(color, instant = false) {
      const root = document.documentElement;

      if (instant) {
        root.style.transition = "none";
        document.body.style.transition = "none";
      }

      root.style.setProperty("--site-bg", color);

      if (themeColor) {
        themeColor.setAttribute("content", color);
      }

      if (instant) {
        void document.body.offsetWidth;
        root.style.transition = "";
        document.body.style.transition = "";
      }
    }

    /* RESET IMAGE LAYERS */

    function resetLayers() {
      layers.forEach(layer => {
        layer.style.transition = "none";
        layer.style.opacity = "0";
        layer.style.filter = "none";
        layer.style.zIndex = "1";
      });

      activeLayer = null;
    }

    /* PRELOAD ONLY THE IMAGES REQUIRED */

    const imageCache = new Map();

    function preloadImages(paths) {
      const unique = [...new Set(paths)];

      return Promise.all(
        unique.map(src => {
          if (imageCache.has(src)) {
            return imageCache.get(src).promise;
          }

          const image = new Image();

          const promise = new Promise(resolve => {
            image.onload = () => resolve(true);

            image.onerror = () => {
              console.error("Image failed:", src);
              resolve(false);
            };
          });

          imageCache.set(src, { image, promise });
          image.src = src;

          return promise;
        })
      ).then(results => results.every(Boolean));
    }

    /* DUAL LAYER CROSSFADE */

    async function showFrame(step, id, mode) {
      if (!isActive(id, mode)) return false;

      const previous = activeLayer;

      const incoming =
        previous === layers[0]
          ? layers[1]
          : layers[0];

      const fade = step.fade ?? 70;
      const duration = step.duration;
      const effect = step.effect || null;

      if (step.background) {
        setBackground(step.background);
      }

      incoming.style.transition = "none";
      incoming.style.opacity = "0";
      incoming.style.zIndex = "3";
      incoming.style.filter = effect
        ? effect.filter
        : "none";

      incoming.src = step.src;

      if (previous) {
        previous.style.zIndex = "2";
      }

      void incoming.offsetWidth;

      const filterDuration = effect
        ? effect.duration
        : fade;

      incoming.style.transition =
        `opacity ${fade}ms linear,
         filter ${filterDuration}ms ease-out`;

      incoming.style.opacity = "1";
      incoming.style.filter = "none";

      await wait(duration);

      if (!isActive(id, mode)) return false;

      if (previous) {
        previous.style.transition = "none";
        previous.style.opacity = "0";
        previous.style.zIndex = "1";
      }

      activeLayer = incoming;

      return true;
    }

    async function playSequence(steps, id, mode) {
      for (const step of steps) {
        if (!isActive(id, mode)) return false;

        const success = await showFrame(
          step,
          id,
          mode
        );

        if (!success) return false;
      }

      return isActive(id, mode);
    }

    /* ========================================
       MOBILE V5
       EXISTING APPROVED ANIMATION
       ======================================== */

    const mobileStates = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-"
      },

      dark: {
        master: "skaldstudio-mobile-dark.webp",
        prefix: "skaldstudio-mobile-dark-character-"
      }
    };

    const mobileOrder = [
      "normal",
      "light",
      "dark"
    ];

    function mobileFrame(state, number) {
      return (
        mobileStates[state].prefix +
        String(number).padStart(2, "0") +
        ".webp?" +
        MOBILE_VERSION
      );
    }

    function mobileMaster(state) {
      return (
        mobileStates[state].master +
        "?" +
        MOBILE_VERSION
      );
    }

    function mobileEffect(step, from, to) {
      if (
        step.state !== to ||
        (step.number !== 6 && step.number !== 4)
      ) {
        return null;
      }

      if (from === "normal" && to === "light") {
        return {
          filter: "brightness(1.08) blur(0.8px)",
          duration: 160
        };
      }

      if (from === "light" && to === "dark") {
        return {
          filter: "brightness(0.88) contrast(1.10) blur(0.5px)",
          duration: 150
        };
      }

      if (from === "dark" && to === "normal") {
        return {
          filter: "brightness(0.96) blur(0.4px)",
          duration: 140
        };
      }

      return null;
    }

    function mobileSequence(from, to) {
      const frames = [];

      /* FORWARD 01 TO 09 */

      for (let n = 1; n <= 9; n++) {
        frames.push({
          state: from,
          number: n,
          src: mobileFrame(from, n)
        });
      }

      /* REVERSE WITH INCOMING COLOR */

      const reverse = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of reverse) {
        frames.push({
          state,
          number,
          src: mobileFrame(state, number)
        });
      }

      frames.push({
        state: to,
        number: 0,
        src: mobileMaster(to)
      });

      const frameDuration = 3000 / frames.length;
      let backgroundChanged = false;

      return frames.map(frame => {
        const step = {
          ...frame,
          duration: frameDuration,
          fade: 70,
          effect: mobileEffect(frame, from, to)
        };

        if (
          !backgroundChanged &&
          frame.state === to
        ) {
          step.background = COLORS[to];
          backgroundChanged = true;
        }

        return step;
      });
    }

    function mobilePreloadPaths() {
      const paths = [];

      for (const state of mobileOrder) {
        paths.push(mobileMaster(state));

        for (let n = 1; n <= 9; n++) {
          paths.push(mobileFrame(state, n));
        }
      }

      return paths;
    }

    async function playMobile(id) {
      const startup = await Promise.all([
        wait(10000),
        preloadImages(mobilePreloadPaths())
      ]);

      if (!isActive(id, "mobile") || !startup[1]) {
        return;
      }

      let index = 0;

      while (isActive(id, "mobile")) {
        const next = (index + 1) % mobileOrder.length;

        const completed = await playSequence(
          mobileSequence(
            mobileOrder[index],
            mobileOrder[next]
          ),
          id,
          "mobile"
        );

        if (!completed) break;

        index = next;

        await wait(10000);
      }
    }

    /* ========================================
       DESKTOP V6
       DJUP + STRAUM
       ======================================== */

    function desktopFile(state, product, number) {
      return (
        "skaldstudio-desktop-" +
        state + "-" +
        product + "-" +
        String(number).padStart(2, "0") +
        ".webp?" +
        DESKTOP_VERSION
      );
    }

    function desktopBackground(state) {
      return (
        "skaldstudio-desktop-" +
        state +
        "-bg.webp?" +
        DESKTOP_VERSION
      );
    }

    /*
      DESKTOP SEQUENCE

      DJUP 10 -> 01
      STRAUM INSERT
      BACKGROUND TRANSFORMATION
      STRAUM INSERT
      DJUP 01 -> 10

      TOTAL 5000 MS
    */

    function desktopSequence(from, to) {
      const steps = [];

      /* 01 / DJUP DISSOLVE / 1600 MS */

      for (let n = 10; n >= 1; n--) {
        steps.push({
          src: desktopFile(from, "djup", n),
          duration: 160,
          fade: 70
        });
      }

      /* 02 / STRAUM BREACH / 330 MS */

      const outgoingBoards =
        from === "light"
          ? [7, 9, 10]
          : [8, 4, 1];

      for (const n of outgoingBoards) {
        steps.push({
          src: desktopFile(from, "straum", n),
          duration: 110,
          fade: 30
        });
      }

      /* 03 / EMPTY CURRENT BACKGROUND / 150 MS */

      steps.push({
        src: desktopBackground(from),
        duration: 150,
        fade: 110
      });

      /* 04 / BACKGROUND TRANSFORMATION / 450 MS */

      steps.push({
        src: desktopBackground(to),
        duration: 450,
        fade: 450,
        background: COLORS[to]
      });

      /* 05 / STRAUM RETURN / 300 MS */

      const incomingBoards =
        to === "dark"
          ? [1, 4, 8]
          : [10, 9, 7];

      for (const n of incomingBoards) {
        steps.push({
          src: desktopFile(to, "straum", n),
          duration: 100,
          fade: 35
        });
      }

      /* 06 / DJUP MATERIALIZATION / 2170 MS */

      for (let n = 1; n <= 10; n++) {
        steps.push({
          src: desktopFile(to, "djup", n),
          duration: 217,
          fade: 70
        });
      }

      return steps;
    }

    function desktopPreloadPaths() {
      const paths = [
        desktopFile("light", "djup", 10)
      ];

      for (const [from, to] of [
        ["light", "dark"],
        ["dark", "light"]
      ]) {
        for (const step of desktopSequence(from, to)) {
          paths.push(step.src);
        }
      }

      return paths;
    }

    async function playDesktop(id) {
      /*
        FIRST 10 SECONDS:
        LIGHT DJUP MASTER
      */

      const startup = await Promise.all([
        wait(10000),
        preloadImages(desktopPreloadPaths())
      ]);

      if (!isActive(id, "desktop") || !startup[1]) {
        return;
      }

      let state = "light";

      while (isActive(id, "desktop")) {
        const next =
          state === "light" ? "dark" : "light";

        const completed = await playSequence(
          desktopSequence(state, next),
          id,
          "desktop"
        );

        if (!completed) break;

        state = next;

        /* STATIC STATE / 10 SECONDS */

        await wait(10000);
      }
    }

    /* ========================================
       ORIENTATION / VISIBILITY CONTROL
       ======================================== */

    function restartAnimation() {
      runId++;

      resetLayers();

      const mode = currentMode();

      if (mode === "mobile") {
        setBackground(COLORS.normal, true);
      } else {
        setBackground(COLORS.light, true);
      }

      if (reducedMotion.matches || document.hidden) {
        return;
      }

      if (mode === "mobile") {
        playMobile(runId);
      } else {
        playDesktop(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    /* INITIAL START */

    restartAnimation();
  </script>

</body>
</html>
