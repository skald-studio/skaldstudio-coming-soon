
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
    content="SKALD STUDIO. Independent design practice. Brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#c7c8c5">

  <style>
    :root {
      --site-bg: #c7c8c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--site-bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /*
      ONE PERMANENT BASE IMAGE.

      The desktop and mobile images are separate
      so responsive source selection cannot
      override JavaScript image changes.
    */

    .base-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .base-mobile {
      display: none;
    }

    /*
      ONE TEMPORARY TRANSITION LAYER.

      The base always stays fully visible.
      The overlay is removed after each frame
      has been committed to the base.
    */

    .transition-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /*
      CONTACT IS INDEPENDENT OF THE ANIMATION.
    */

    .contact {
      position: absolute;
      display: block;
      left: 70%;
      top: 57%;
      width: 28%;
      height: 25%;
      z-index: 20;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .contact:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      :root {
        --site-bg: #88797a;
      }

      .base-desktop {
        display: none;
      }

      .base-mobile {
        display: block;
      }

      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .transition-image {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- PERMANENT DESKTOP IMAGE -->

    <img
      id="desktop-base"
      class="base-image base-desktop"
      src="skaldstudio-desktop-light-djup-10.webp"
      alt=""
      fetchpriority="high"
    >

    <!-- PERMANENT MOBILE IMAGE -->

    <img
      id="mobile-base"
      class="base-image base-mobile"
      src="skaldstudio-mobile-normal.webp"
      alt=""
    >

    <!-- SINGLE TEMPORARY TRANSITION LAYER -->

    <img
      id="transition-image"
      class="transition-image"
      alt=""
      aria-hidden="true"
    >

    <!-- PERMANENT CONTACT LINK -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
      title="contact@skaldstudio.com"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO
      DESKTOP ANIMATION V9

      DESIGN PRINCIPLES

      1. No glitch overlays.
      2. No background image frames.
      3. One fully opaque base image.
      4. Ghosting only during transitions.
      5. Clean cuts between LIGHT and DARK.
      6. Different frequencies in each direction.
      7. All 40 desktop product images included.

      MOBILE PORTRAIT
      Existing V5 image sequence retained.
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const desktopBase =
      document.getElementById("desktop-base");

    const mobileBase =
      document.getElementById("mobile-base");

    const overlay =
      document.getElementById("transition-image");

    const themeColor = document.querySelector(
      'meta[name="theme-color"]'
    );

    const COLORS = {
      normal: "#88797a",
      light: "#c7c8c5",
      dark: "#292b2b"
    };

    const DESKTOP_VERSION = "v9";
    const MOBILE_VERSION = "v5";

    let runId = 0;
    let currentAnimation = null;

    const imageCache = new Map();

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    /* =====================================
       RESPONSIVE STATE
       ===================================== */

    function currentMode() {
      return portrait.matches ? "mobile" : "desktop";
    }

    function active(id, expectedMode) {
      return (
        id === runId &&
        currentMode() === expectedMode &&
        !document.hidden &&
        !reducedMotion.matches
      );
    }

    function currentBase(expectedMode) {
      return expectedMode === "mobile"
        ? mobileBase
        : desktopBase;
    }

    /* =====================================
       BACKGROUND CONTROL
       ===================================== */

    function setBackground(state) {
      const color = COLORS[state];

      document.documentElement.style.setProperty(
        "--site-bg",
        color
      );

      if (themeColor) {
        themeColor.setAttribute(
          "content",
          color
        );
      }
    }

    /* =====================================
       IMAGE LOADING
       ===================================== */

    function ensureImage(src) {
      if (imageCache.has(src)) {
        return imageCache.get(src);
      }

      const image = new Image();

      const promise = new Promise(resolve => {
        image.onload = () => resolve(true);

        image.onerror = () => {
          console.error(
            "Image could not be loaded:",
            src
          );

          resolve(false);
        };
      });

      imageCache.set(src, promise);
      image.src = src;

      return promise;
    }

    async function preloadImages(paths) {
      const unique = [...new Set(paths)];

      const results = await Promise.all(
        unique.map(ensureImage)
      );

      return results.every(Boolean);
    }

    /* =====================================
       TRANSITION RESET
       ===================================== */

    function clearOverlay() {
      if (currentAnimation) {
        currentAnimation.cancel();
        currentAnimation = null;
      }

      overlay.getAnimations().forEach(
        animation => animation.cancel()
      );

      overlay.style.opacity = "0";
      overlay.removeAttribute("src");
    }

    /* =====================================
       V9 FRAME ENGINE

       CUT:
       Direct full image replacement.
       Used for LIGHT / DARK switching.

       GHOST:
       A short temporary overlay.
       The incoming image is then committed
       to the permanent opaque base.

       No previous frame remains underneath.
       ===================================== */

    async function showFrame(
      step,
      id,
      expectedMode
    ) {
      if (!active(id, expectedMode)) {
        return false;
      }

      const loaded = await ensureImage(step.src);

      if (!loaded || !active(id, expectedMode)) {
        return false;
      }

      const base = currentBase(expectedMode);

      const duration = step.ms ?? 180;
      const style = step.style ?? "ghost";

      /* CLEAN CUT */

      if (style === "cut") {
        clearOverlay();

        base.src = step.src;

        if (step.state) {
          setBackground(step.state);
        }

        await wait(duration);

        return active(id, expectedMode);
      }

      /* CONTROLLED GHOST TRANSITION */

      const fade = Math.min(
        step.fade ?? 120,
        duration
      );

      clearOverlay();

      overlay.src = step.src;
      overlay.style.opacity = "0";

      if (step.state) {
        setBackground(step.state);
      }

      const startingFilter =
        step.filterStart || "none";

      currentAnimation = overlay.animate(
        [
          {
            opacity: 0,
            filter: startingFilter,
            offset: 0
          },
          {
            opacity: 0.32,
            filter: startingFilter,
            offset: 0.42
          },
          {
            opacity: 0.68,
            filter: "none",
            offset: 0.76
          },
          {
            opacity: 1,
            filter: "none",
            offset: 1
          }
        ],
        {
          duration: fade,
          easing: "ease-in-out",
          fill: "forwards"
        }
      );

      try {
        await currentAnimation.finished;
      } catch (error) {
        return false;
      }

      if (!active(id, expectedMode)) {
        return false;
      }

      /*
        Commit the fully visible incoming image
        to the base before removing the overlay.
      */

      base.src = step.src;

      await new Promise(resolve => {
        requestAnimationFrame(resolve);
      });

      if (!active(id, expectedMode)) {
        return false;
      }

      clearOverlay();

      await wait(Math.max(0, duration - fade));

      return active(id, expectedMode);
    }

    async function playSequence(
      steps,
      id,
      expectedMode
    ) {
      for (const step of steps) {
        const completed = await showFrame(
          step,
          id,
          expectedMode
        );

        if (!completed) {
          return false;
        }
      }

      return active(id, expectedMode);
    }

    /* =====================================
       DESKTOP IMAGE PATHS
       ===================================== */

    function desktopFrame(
      state,
      product,
      number
    ) {
      return (
        "skaldstudio-desktop-" +
        state + "-" +
        product + "-" +
        String(number).padStart(2, "0") +
        ".webp"
      );
    }

    function desktopPreloadPaths() {
      const paths = [];

      for (const state of ["light", "dark"]) {
        for (let n = 1; n <= 10; n++) {
          paths.push(
            desktopFrame(state, "djup", n)
          );

          paths.push(
            desktopFrame(state, "straum", n)
          );
        }
      }

      return paths;
    }

    function addFrame(
      steps,
      state,
      product,
      number,
      ms,
      style = "ghost",
      fade = 120
    ) {
      steps.push({
        src: desktopFrame(
          state,
          product,
          number
        ),
        state,
        ms,
        style,
        fade
      });
    }

    /* =====================================
       FREQUENCY 01

       LIGHT TO DARK

       1. DJUP fades away gradually.
       2. STRAUM appears and develops.
       3. DARK enters through STRAUM.
       4. DJUP reconstructs slowly.
       5. A recognizable LIGHT echo.
       6. DARK establishes itself.

       ALL 40 PRODUCT IMAGES APPEAR
       IN THIS FREQUENCY.
       ===================================== */

    function lightToDarkSequence() {
      const steps = [];

      /* DJUP LIGHT / DISSOLVE */

      for (let n = 9; n >= 1; n--) {
        addFrame(
          steps,
          "light",
          "djup",
          n,
          160 + (9 - n) * 5,
          "ghost",
          110
        );
      }

      /* STRAUM LIGHT / DEVELOPING SIGNAL */

      const lightBoardTiming = [
        150, 175, 160, 210, 180,
        215, 230, 250, 290, 880
      ];

      for (let n = 1; n <= 10; n++) {
        const style =
          [1, 4, 8].includes(n)
            ? "cut"
            : "ghost";

        addFrame(
          steps,
          "light",
          "straum",
          n,
          lightBoardTiming[n - 1],
          style,
          95
        );
      }

      /* STRAUM DARK / COLOR INTERRUPTION */

      const darkBoardTiming = [
        175, 155, 175, 205, 180,
        195, 200, 235, 290, 610
      ];

      for (let n = 1; n <= 10; n++) {
        const style =
          [1, 5, 9].includes(n)
            ? "cut"
            : "ghost";

        addFrame(
          steps,
          "dark",
          "straum",
          n,
          darkBoardTiming[n - 1],
          style,
          95
        );
      }

      /* DJUP DARK / MATERIALIZATION */

      const darkDjupTiming = [
        175, 180, 185, 190, 200,
        210, 220, 240, 260, 370
      ];

      for (let n = 1; n <= 10; n++) {
        addFrame(
          steps,
          "dark",
          "djup",
          n,
          darkDjupTiming[n - 1],
          n === 1 ? "cut" : "ghost",
          145
        );
      }

      /*
        ONE RECOGNIZABLE LIGHT ECHO.

        No transparency.
        The entire previous frame is replaced.
      */

      addFrame(
        steps,
        "light",
        "djup",
        10,
        760,
        "cut"
      );

      addFrame(
        steps,
        "dark",
        "djup",
        10,
        490,
        "cut"
      );

      return steps;
    }

    /* =====================================
       FREQUENCY 02

       DARK TO LIGHT

       A DIFFERENT COMPOSITION.

       1. DJUP loses definition unevenly.
       2. STRAUM breaks the sequence.
       3. LIGHT arrives earlier than expected.
       4. STRAUM receives a longer reveal.
       5. DJUP slowly materializes.
       6. One final DARK STRAUM echo.
       7. LIGHT establishes itself.
       ===================================== */

    function darkToLightSequence() {
      const steps = [];

      /* DJUP DARK / UNEVEN DISSOLVE */

      const darkDjupFrames = [
        [9, 245],
        [8, 230],
        [7, 205],
        [6, 190],
        [5, 255],
        [3, 185],
        [2, 210],
        [1, 235]
      ];

      for (const [number, ms] of darkDjupFrames) {
        addFrame(
          steps,
          "dark",
          "djup",
          number,
          ms,
          number === 5 ? "cut" : "ghost",
          135
        );
      }

      /* STRAUM DARK / IRREGULAR INTERRUPTION */

      const darkBoardFrames = [
        [2, 180],
        [4, 170],
        [6, 220],
        [8, 195],
        [10, 820]
      ];

      for (const [number, ms] of darkBoardFrames) {
        addFrame(
          steps,
          "dark",
          "straum",
          number,
          ms,
          [2, 8].includes(number)
            ? "cut"
            : "ghost",
          100
        );
      }

      /* STRAUM LIGHT / EARLY LIGHT SIGNAL */

      const lightBoardFrames = [
        [1, 170],
        [2, 190],
        [4, 235],
        [6, 200],
        [7, 255],
        [9, 320],
        [10, 920]
      ];

      for (const [number, ms] of lightBoardFrames) {
        addFrame(
          steps,
          "light",
          "straum",
          number,
          ms,
          [1, 7].includes(number)
            ? "cut"
            : "ghost",
          115
        );
      }

      /* DJUP LIGHT / SLOW RECONSTRUCTION */

      const lightDjupTiming = [
        180, 185, 190, 200, 210,
        225, 235, 250, 280, 430
      ];

      for (let n = 1; n <= 10; n++) {
        addFrame(
          steps,
          "light",
          "djup",
          n,
          lightDjupTiming[n - 1],
          n === 1 ? "cut" : "ghost",
          145
        );
      }

      /*
        FINAL DARK ECHO.

        A complete STRAUM image,
        held long enough to recognize.
      */

      addFrame(
        steps,
        "dark",
        "straum",
        10,
        730,
        "cut"
      );

      /* CLEAN LIGHT RECOVERY */

      addFrame(
        steps,
        "light",
        "djup",
        10,
        530,
        "cut"
      );

      return steps;
    }

    /* =====================================
       DESKTOP LOOP
       ===================================== */

    async function playDesktop(id) {
      const startup = await Promise.all([
        wait(10000),
        preloadImages(
          desktopPreloadPaths()
        )
      ]);

      if (
        !active(id, "desktop") ||
        !startup[1]
      ) {
        return;
      }

      const lightToDark =
        lightToDarkSequence();

      const darkToLight =
        darkToLightSequence();

      while (active(id, "desktop")) {
        /* LIGHT TO DARK */

        const first = await playSequence(
          lightToDark,
          id,
          "desktop"
        );

        if (!first) break;

        /* DARK / STATIC HOLD */

        await wait(10000);

        if (!active(id, "desktop")) break;

        /* DARK TO LIGHT */

        const second = await playSequence(
          darkToLight,
          id,
          "desktop"
        );

        if (!second) break;

        /* LIGHT / STATIC HOLD */

        await wait(10000);
      }
    }

    /* =====================================
       MOBILE V5
       ORIGINAL FRAME ORDER

       NORMAL -> LIGHT -> DARK -> NORMAL
       10 SECOND HOLD
       3 SECOND TRANSITION

       NO CHANGE TO ASSET FILENAMES
       ===================================== */

    const mobileStates = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-"
      },

      dark: {
        master: "skaldstudio-mobile-dark.webp",
        prefix: "skaldstudio-mobile-dark-character-"
      }
    };

    const mobileOrder = [
      "normal",
      "light",
      "dark"
    ];

    function mobileFrame(state, number) {
      return (
        mobileStates[state].prefix +
        String(number).padStart(2, "0") +
        ".webp?" +
        MOBILE_VERSION
      );
    }

    function mobileMaster(state) {
      return (
        mobileStates[state].master +
        "?" +
        MOBILE_VERSION
      );
    }

    function mobilePreloadPaths() {
      const paths = [];

      for (const state of mobileOrder) {
        paths.push(
          mobileMaster(state)
        );

        for (let n = 1; n <= 9; n++) {
          paths.push(
            mobileFrame(state, n)
          );
        }
      }

      return paths;
    }

    function mobileFilter(frame, from, to) {
      if (
        frame.state !== to ||
        ![4, 6].includes(frame.number)
      ) {
        return null;
      }

      if (from === "normal" && to === "light") {
        return "brightness(1.08) blur(0.8px)";
      }

      if (from === "light" && to === "dark") {
        return "brightness(0.88) contrast(1.10) blur(0.5px)";
      }

      if (from === "dark" && to === "normal") {
        return "brightness(0.96) blur(0.4px)";
      }

      return null;
    }

    function mobileSequence(from, to) {
      const frames = [];

      /* FORWARD 01 TO 09 */

      for (let n = 1; n <= 9; n++) {
        frames.push({
          state: from,
          number: n,
          src: mobileFrame(from, n)
        });
      }

      /* REVERSE WITH INCOMING COLOR */

      const reverse = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of reverse) {
        frames.push({
          state,
          number,
          src: mobileFrame(state, number)
        });
      }

      frames.push({
        state: to,
        number: 0,
        src: mobileMaster(to)
      });

      const duration =
        3000 / frames.length;

      return frames.map(frame => ({
        src: frame.src,
        state: frame.state,
        ms: duration,
        fade: 70,
        style: "ghost",
        filterStart: mobileFilter(
          frame,
          from,
          to
        )
      }));
    }

    async function playMobile(id) {
      const startup = await Promise.all([
        wait(10000),
        preloadImages(
          mobilePreloadPaths()
        )
      ]);

      if (
        !active(id, "mobile") ||
        !startup[1]
      ) {
        return;
      }

      let index = 0;

      while (active(id, "mobile")) {
        const next =
          (index + 1) % mobileOrder.length;

        const completed = await playSequence(
          mobileSequence(
            mobileOrder[index],
            mobileOrder[next]
          ),
          id,
          "mobile"
        );

        if (!completed) break;

        index = next;

        await wait(10000);
      }
    }

    /* =====================================
       RESET / ORIENTATION / VISIBILITY
       ===================================== */

    function restartAnimation() {
      runId++;

      clearOverlay();

      const selectedMode = currentMode();

      if (selectedMode === "mobile") {
        mobileBase.src =
          "skaldstudio-mobile-normal.webp";

        setBackground("normal");
      } else {
        desktopBase.src =
          "skaldstudio-desktop-light-djup-10.webp";

        setBackground("light");
      }

      if (
        document.hidden ||
        reducedMotion.matches
      ) {
        return;
      }

      if (selectedMode === "mobile") {
        playMobile(runId);
      } else {
        playDesktop(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    /* START */

    restartAnimation();
  </script>
</body>
</html>
