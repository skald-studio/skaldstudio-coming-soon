
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>SKALD STUDIO | Independent Design Practice</title>

  <meta name="description"
        content="SKALD STUDIO is an independent design practice specializing in brand identity, apparel and product design, development and production. A new site is taking shape.">

  <meta name="theme-color" content="#88797a">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: #88797a;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #88797a;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    picture {
      display: block;
      width: 100%;
    }

    picture img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ANIMATION LAYERS */

    .glitch-frame {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* CONTACT DESKTOP */

    .contact {
      position: absolute;
      left: 73%;
      top: 63%;
      width: 24%;
      height: 9%;
      z-index: 10;
      cursor: pointer;
    }

    .contact:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* MOBILE PORTRAIT */

    @media (max-width: 700px) and (orientation: portrait) {
      .contact {
        left: 4%;
        top: 82%;
        width: 55%;
        height: 7%;
      }

      .glitch-frame {
        display: block;
      }
    }

    /* ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      .glitch-frame {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1 class="sr-only">SKALD STUDIO</h1>

    <p class="sr-only">
      Independent design practice.
      Brand identity.
      Apparel and product design.
      Development and production.
      A new site is taking shape.
    </p>

    <!-- RESPONSIVE BASE IMAGE -->

    <picture>
      <source
        media="(max-width: 700px) and (orientation: portrait)"
        srcset="skaldstudio-mobile-normal.webp"
        type="image/webp"
      >

      <img
        src="skaldstudio-desktop-normal.webp"
        alt=""
        fetchpriority="high"
      >
    </picture>

    <!-- DUAL ANIMATION LAYERS -->

    <img
      id="glitch-a"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <img
      id="glitch-b"
      class="glitch-frame"
      alt=""
      aria-hidden="true"
    >

    <!-- CONTACT -->

    <a
      class="contact"
      href="mailto:contact@skaldstudio.com"
      aria-label="Contact SKALD STUDIO by email"
    ></a>

  </main>

  <script>
    /*
      SKALD STUDIO
      MOBILE ANIMATION V4

      NORMAL  10s
      TRANSITION NORMAL TO LIGHT  3s
      LIGHT   10s
      TRANSITION LIGHT TO NORMAL  3s

      CONTINUOUS 26 SECOND LOOP
    */

    const portrait = window.matchMedia(
      "(max-width: 700px) and (orientation: portrait)"
    );

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const layers = [
      document.getElementById("glitch-a"),
      document.getElementById("glitch-b")
    ];

    /* ANIMATION SETTINGS */

    const STATIC_DURATION = 10000;
    const TRANSITION_DURATION = 3000;
    const CROSSFADE_DURATION = 70;
    const EXPOSURE_DURATION = 100;

    /* IMAGE VERSION */

    const IMAGE_VERSION = "v4";

    const states = {
      normal: {
        master: "skaldstudio-mobile-normal.webp",
        prefix: "skaldstudio-mobile-character-"
      },

      light: {
        master: "skaldstudio-mobile-light.webp",
        prefix: "skaldstudio-mobile-light-character-"
      }
    };

    function framePath(state, number) {
      const file = String(number).padStart(2, "0");

      return (
        states[state].prefix +
        file +
        ".webp?" +
        IMAGE_VERSION
      );
    }

    function masterPath(state) {
      return states[state].master + "?" + IMAGE_VERSION;
    }

    /*
      TRANSITION SEQUENCE

      FORWARD:
      01 TO 09 / CURRENT STATE

      RETURN:
      08 CURRENT
      07 CURRENT
      06 NEXT
      05 CURRENT
      04 NEXT
      03 NEXT
      02 NEXT
      01 NEXT

      END:
      NEXT MASTER STATE
    */

    function buildSequence(from, to) {
      const steps = [];

      for (let n = 1; n <= 9; n++) {
        steps.push({
          state: from,
          number: n,
          src: framePath(from, n)
        });
      }

      const returnFrames = [
        [from, 8],
        [from, 7],
        [to, 6],
        [from, 5],
        [to, 4],
        [to, 3],
        [to, 2],
        [to, 1]
      ];

      for (const [state, number] of returnFrames) {
        steps.push({
          state,
          number,
          src: framePath(state, number)
        });
      }

      steps.push({
        state: to,
        number: 0,
        src: masterPath(to)
      });

      return steps;
    }

    /* PRELOAD BOTH STATES */

    let preloadPromise = null;
    const imageCache = [];

    function preloadImages() {
      if (preloadPromise) return preloadPromise;

      const paths = [
        masterPath("normal"),
        masterPath("light")
      ];

      for (const state of ["normal", "light"]) {
        for (let n = 1; n <= 9; n++) {
          paths.push(framePath(state, n));
        }
      }

      preloadPromise = Promise.all(
        paths.map(src => new Promise(resolve => {
          const image = new Image();

          imageCache.push(image);

          image.onload = () => resolve(true);
          image.onerror = () => {
            console.error("Image failed:", src);
            resolve(false);
          };

          image.src = src;
        }))
      ).then(results => results.every(Boolean));

      return preloadPromise;
    }

    const wait = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    let runId = 0;
    let activeLayer = null;

    function isActive(id) {
      return (
        id === runId &&
        portrait.matches &&
        !reducedMotion.matches &&
        !document.hidden
      );
    }

    /* RESET WITHOUT CHANGING PAGE LAYOUT */

    function resetLayers() {
      layers.forEach(layer => {
        layer.style.transition = "none";
        layer.style.opacity = "0";
        layer.style.filter = "none";
        layer.style.zIndex = "1";
      });

      activeLayer = null;
    }

    /*
      CROSSFADE

      NORMAL FRAMES: 70ms CROSSFADE

      LIGHT ENTRY:
      SUBTLE EXPOSURE BLEED

      MOTION SMEAR:
      PROVIDED BY THE PHOTOSHOP FRAMES
    */

    async function fadeTo(step, target, id) {
      if (!isActive(id)) return false;

      const previous = activeLayer;

      const incoming =
        previous === layers[0] ? layers[1] : layers[0];

      /* Only selected LIGHT entries receive exposure */

      const exposure =
        target === "light" &&
        step.state === "light" &&
        (step.number === 6 || step.number === 4);

      incoming.style.transition = "none";
      incoming.style.opacity = "0";
      incoming.style.zIndex = "3";

      incoming.style.filter = exposure
        ? "brightness(1.08) blur(0.8px)"
        : "none";

      incoming.src = step.src;

      if (previous) {
        previous.style.zIndex = "2";
      }

      /* Ensure browser applies the starting state */

      void incoming.offsetWidth;

      incoming.style.transition = exposure
        ? `opacity ${CROSSFADE_DURATION}ms linear,
           filter ${EXPOSURE_DURATION}ms ease-out`
        : `opacity ${CROSSFADE_DURATION}ms linear`;

      incoming.style.opacity = "1";
      incoming.style.filter = "none";

      await wait(
        exposure
          ? EXPOSURE_DURATION
          : CROSSFADE_DURATION
      );

      if (!isActive(id)) return false;

      if (previous) {
        previous.style.transition = "none";
        previous.style.opacity = "0";
        previous.style.zIndex = "1";
      }

      activeLayer = incoming;

      return true;
    }

    /* THREE SECOND TRANSITION */

    async function runTransition(from, to, id) {
      const sequence = buildSequence(from, to);

      const stepDuration =
        TRANSITION_DURATION / sequence.length;

      const started = performance.now();

      for (let i = 0; i < sequence.length; i++) {
        if (!isActive(id)) return false;

        const success = await fadeTo(
          sequence[i],
          to,
          id
        );

        if (!success) return false;

        /* Keep the full transition near 3 seconds */

        const nextTime =
          started + (i + 1) * stepDuration;

        const remaining =
          nextTime - performance.now();

        if (remaining > 0) {
          await wait(remaining);
        }
      }

      return isActive(id);
    }

    /*
      MAIN LOOP

      NORMAL 10s
      NORMAL TO LIGHT 3s
      LIGHT 10s
      LIGHT TO NORMAL 3s
      REPEAT
    */

    async function playAnimation(id) {
      if (!isActive(id)) return;

      /* Preload while the first 10 seconds pass */

      const results = await Promise.all([
        wait(STATIC_DURATION),
        preloadImages()
      ]);

      if (!isActive(id) || !results[1]) return;

      let currentState = "normal";

      while (isActive(id)) {
        const nextState =
          currentState === "normal"
            ? "light"
            : "normal";

        const completed = await runTransition(
          currentState,
          nextState,
          id
        );

        if (!completed || !isActive(id)) break;

        currentState = nextState;

        /* Hold the new master for 10 seconds */

        await wait(STATIC_DURATION);
      }
    }

    /* RESTART WHEN SCREEN ORIENTATION CHANGES */

    function restartAnimation() {
      runId++;

      resetLayers();

      if (
        portrait.matches &&
        !reducedMotion.matches &&
        !document.hidden
      ) {
        playAnimation(runId);
      }
    }

    portrait.addEventListener(
      "change",
      restartAnimation
    );

    reducedMotion.addEventListener(
      "change",
      restartAnimation
    );

    document.addEventListener(
      "visibilitychange",
      restartAnimation
    );

    restartAnimation();
  </script>

</body>
</html>
